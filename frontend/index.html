    <script>
      (function () {
        var h = location.hostname.toLowerCase();
        var apex = 'ugaanlabs.ai';
        var www = 'www.' + apex;
        if (h === 'localhost' || h === '127.0.0.1') return;
        if (h === apex || location.protocol === 'http:') {
          location.replace(
            'https://' + www + location.pathname + location.search + location.hash
          );
        }
      })();
    </script>
