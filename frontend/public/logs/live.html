<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live deployment log</title>
    <style>
      body { font-family: ui-monospace, monospace; margin: 0; background: #020617; color: #e2e8f0; }
      header { padding: 1rem; background: #1e293b; position: sticky; top: 0; }
      pre { margin: 0; padding: 1rem; white-space: pre-wrap; word-break: break-word; }
      a { color: #93c5fd; }
    </style>
  </head>
  <body>
    <header>
      <strong>Deployment log</strong> (auto-refresh 5s)
      · <a href="/logs/">Log hub</a>
      · <a href="/logs/files/live/deploy-current.log">Raw file</a>
    </header>
    <pre id="log">Loading…</pre>
    <script>
      async function refresh() {
        const el = document.getElementById('log');
        try {
          const res = await fetch('/logs/files/live/deploy-current.log', { cache: 'no-store' });
          if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
          el.textContent = await res.text();
        } catch (err) {
          el.textContent = 'Unable to load log: ' + err.message;
        }
      }
      refresh();
      setInterval(refresh, 5000);
    </script>
  </body>
</html>
