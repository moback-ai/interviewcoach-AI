name: Pre-deploy quality gate
description: Block deploy when lint, build, tests, or merge conflicts fail.

inputs:
  git_ref:
    description: Commit SHA or branch ref to validate
    required: true

runs:
  using: composite
  steps:
    - name: Gate · Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      with:
        ref: ${{ inputs.git_ref }}
        fetch-depth: 0

    - name: Gate · Merge conflict check with develop
      shell: bash
      run: |
        set -euo pipefail
        git fetch origin develop
        if ! git rev-parse --verify origin/develop >/dev/null 2>&1; then
          echo "origin/develop not found — skipping conflict check."
          exit 0
        fi
        BASE="$(git merge-base HEAD origin/develop)"
        if git merge-tree "$BASE" HEAD origin/develop | grep -qE '^<<<<<<< '; then
          echo "::error::Merge conflicts with develop — deploy rejected."
          exit 1
        fi
        echo "No merge conflicts with develop."

    - name: Gate · Setup Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Gate · Frontend install
      shell: bash
      working-directory: frontend
      run: npm ci --legacy-peer-deps

    - name: Gate · Frontend lint
      shell: bash
      working-directory: frontend
      run: npm run lint

    - name: Gate · Frontend build and login bundle
      shell: bash
      run: |
        set -euo pipefail
        cd frontend
        echo "VITE_API_BASE_URL=/api" > .env
        echo "VITE_STORAGE_URL=/storage" >> .env
        npm run build
        bash ../scripts/verify-frontend-login-bundle.sh dist

    - name: Gate · Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: backend/requirements-ci.txt

    - name: Gate · Backend tests
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        pip install -r backend/requirements-ci.txt
        python -m pytest backend/tests/ -q

    - name: Gate · Summary
      shell: bash
      env:
        GATE_GIT_REF: ${{ inputs.git_ref }}
      run: |
        {
          echo "## Quality gate passed"
          echo "- Ref: \`${GATE_GIT_REF}\`"
          echo "- Merge conflicts with develop: none"
          echo "- Frontend lint, build, login bundle: ok"
          echo "- Backend pytest: ok"
          echo ""
          echo "Deploy may proceed after admin production approval."
        } >> "$GITHUB_STEP_SUMMARY"
