name: Security gate
description: Lint, tests, dependency audits, secrets scan — blocks merge or deploy on failure.

inputs:
  scan_frontend:
    description: Run frontend lint, audit, build, and login bundle guard
    required: false
    default: 'true'
  scan_backend:
    description: Run backend tests, pip-audit, and Bandit
    required: false
    default: 'true'
  check_merge_conflicts:
    description: Fail if the checked-out ref has merge conflicts with develop
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Merge conflict check
      if: inputs.check_merge_conflicts == 'true'
      shell: bash
      run: |
        set -euo pipefail
        git fetch --no-tags origin develop
        if git grep -n '^<<<<<<< ' HEAD -- ':!*.md' 2>/dev/null; then
          echo "::error::Unresolved merge conflict markers in this branch."
          exit 1
        fi
        if ! git merge-tree "$(git merge-base HEAD origin/develop)" HEAD origin/develop | grep -q '^changed in both'; then
          echo "No merge conflicts with develop."
        else
          if git merge-tree "$(git merge-base HEAD origin/develop)" HEAD origin/develop | grep -q '^+<<<<<<< '; then
            echo "::error::This branch conflicts with develop. Rebase or merge develop first."
            exit 1
          fi
        fi
        echo "Merge conflict check passed."

    - name: Install Gitleaks CLI
      shell: bash
      run: |
        curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
          | tar -xz -C /usr/local/bin gitleaks

    - name: Gitleaks detect
      shell: bash
      run: gitleaks detect --source . --config .gitleaks.toml --verbose

    - name: Setup Node
      if: inputs.scan_frontend == 'true'
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Frontend lint
      if: inputs.scan_frontend == 'true'
      shell: bash
      working-directory: frontend
      run: |
        npm ci --legacy-peer-deps
        npm run lint -- --max-warnings 0

    - name: Frontend dependency audit
      if: inputs.scan_frontend == 'true'
      shell: bash
      working-directory: frontend
      run: npm audit --audit-level=high

    - name: Frontend build + login bundle guard
      if: inputs.scan_frontend == 'true'
      shell: bash
      working-directory: frontend
      run: |
        echo "VITE_API_BASE_URL=/api" > .env
        echo "VITE_STORAGE_URL=/storage" >> .env
        npm run build
        bash ../scripts/verify-frontend-login-bundle.sh dist

    - name: Setup Python
      if: inputs.scan_backend == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: backend/requirements.txt

    - name: Backend unit tests
      if: inputs.scan_backend == 'true'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt pytest
        python -m pytest backend/tests/ -q

    - name: Backend dependency audit
      if: inputs.scan_backend == 'true'
      shell: bash
      run: |
        pip install pip-audit
        bash scripts/pip-audit-production.sh

    - name: Backend source scan (Bandit)
      if: inputs.scan_backend == 'true'
      shell: bash
      run: |
        pip install bandit
        bandit -c .github/bandit.yml -r backend -lll

    - name: Security gate passed
      shell: bash
      run: echo "Security gate passed."
