name: Setup deploy SSH
description: Configure SSH key and SSH_OPTS for EC2 maintenance and deploy jobs.

runs:
  using: composite
  steps:
    - name: Write SSH key
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        echo "${{ env.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem
        chmod 400 ~/.ssh/deploy_key.pem
        echo 'SSH_OPTS=-i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15' >> "$GITHUB_ENV"
