version: 2
updates:
  # Security-only updates; no flood of version-bump PRs (batch on develop instead).
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    labels:
      - dependencies
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    labels:
      - dependencies
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    labels:
      - dependencies
    cooldown:
      default-days: 7
