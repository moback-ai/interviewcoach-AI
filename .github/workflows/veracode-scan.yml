# Manual Veracode upload — requires org license and repository secrets:
#   VERACODE_API_ID, VERACODE_API_KEY
# See docs/SECURITY_SCANNING.md

name: Veracode Scan (Manual)

on:
  workflow_dispatch:
    inputs:
      sandbox_name:
        description: Veracode sandbox (optional)
        required: false
        default: develop

permissions:
  contents: read

jobs:
  veracode-upload:
    name: Package and upload to Veracode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Veracode secrets
        run: |
          if [ -z "${{ secrets.VERACODE_API_ID }}" ] || [ -z "${{ secrets.VERACODE_API_KEY }}" ]; then
            echo "::error::Missing VERACODE_API_ID or VERACODE_API_KEY repository secrets."
            echo "Add secrets under Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi

      - name: Build application archive
        run: |
          zip -r veracode-app.zip frontend backend scripts \
            -x "**/node_modules/**" "**/dist/**" "**/.git/**" "backend/Piper/**" "**/__pycache__/**"
          ls -lh veracode-app.zip

      - name: Veracode Upload and Scan
        uses: veracode/veracode-uploadandscan-action@0.2.11
        with:
          vid: ${{ secrets.VERACODE_API_ID }}
          vkey: ${{ secrets.VERACODE_API_KEY }}
          filepath: veracode-app.zip
          appname: interviewcoach-AI
          createprofile: true
          version: ${{ github.sha }}
          sandboxname: ${{ github.event.inputs.sandbox_name }}
