# One Veracode policy scan — manual only (requires org license).
# Add repository secrets: VERACODE_API_ID, VERACODE_API_KEY
# See docs/SECURITY_SCANNING.md

name: Veracode Scan

on:
  workflow_dispatch:
    inputs:
      sandbox_name:
        description: Veracode sandbox name (leave default for develop)
        required: false
        default: develop

permissions:
  contents: read

jobs:
  veracode:
    name: Veracode policy scan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Veracode secrets
        run: |
          if [ -z "${{ secrets.VERACODE_API_ID }}" ] || [ -z "${{ secrets.VERACODE_API_KEY }}" ]; then
            echo "::error::Missing VERACODE_API_ID or VERACODE_API_KEY."
            echo "GitHub → Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: Package application for Veracode
        run: |
          zip -r veracode-app.zip frontend backend scripts \
            -x "**/node_modules/**" "**/dist/**" "**/.git/**" "backend/Piper/**" "**/__pycache__/**"
          ls -lh veracode-app.zip

      - name: Upload and scan (Veracode)
        uses: veracode/veracode-uploadandscan-action@0.2.7
        with:
          vid: ${{ secrets.VERACODE_API_ID }}
          vkey: ${{ secrets.VERACODE_API_KEY }}
          filepath: veracode-app.zip
          appname: interviewcoach-AI
          createprofile: true
          version: ${{ github.sha }}
          sandboxname: ${{ github.event.inputs.sandbox_name }}

      - name: Summary
        run: |
          {
            echo "## Veracode scan submitted"
            echo "- App: \`interviewcoach-AI\`"
            echo "- Version: \`${{ github.sha }}\`"
            echo "- Sandbox: \`${{ github.event.inputs.sandbox_name }}\`"
            echo ""
            echo "Results appear in the [Veracode portal](https://analysiscenter.veracode.com/) when the scan completes (often 15–60 min)."
          } >> "$GITHUB_STEP_SUMMARY"
