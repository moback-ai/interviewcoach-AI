name: Auto Deploy Main (Disabled)

# main is not deployed. Production deploys run from develop and develop/* only.
# See auto-deploy-develop.yml and BRANCH_POLICY.md.

on:
  workflow_dispatch:

jobs:
  blocked:
    name: Main auto-deploy is disabled
    runs-on: ubuntu-latest
    steps:
      - name: Explain policy
        run: |
          echo "Deploying from main is disabled."
          echo "Use develop (integration) or develop/<feature> branches."
          echo "main is synced monthly from develop via monthly-sync-main-from-develop.yml"
          exit 1
