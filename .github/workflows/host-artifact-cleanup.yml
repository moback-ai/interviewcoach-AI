name: Host Artifact Cleanup

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print actions without deleting
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  cleanup:
    name: Prune releases, builds, and logs on EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cleanup backend and frontend hosts
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 400 ~/.ssh/deploy_key.pem
          SSH_OPTS="-i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15"

          scp $SSH_OPTS scripts/cleanup-host-artifacts.sh scripts/log-maintenance.sh \
            ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }}:/tmp/

          ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} \
            "KEEP_SUCCESSFUL_RELEASES=2 DRY_RUN=$DRY_RUN bash /tmp/cleanup-host-artifacts.sh"

          scp $SSH_OPTS scripts/cleanup-host-artifacts.sh scripts/log-maintenance.sh \
            ${{ secrets.EC2_USER }}@${{ secrets.FRONTEND_HOST }}:/tmp/

          ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.FRONTEND_HOST }} \
            "KEEP_SUCCESSFUL_RELEASES=2 DRY_RUN=$DRY_RUN bash /tmp/cleanup-host-artifacts.sh"

          if [[ -n "${{ secrets.AI_HOST }}" ]]; then
            scp $SSH_OPTS scripts/cleanup-host-artifacts.sh \
              ${{ secrets.EC2_USER }}@${{ secrets.AI_HOST }}:/tmp/
            ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.AI_HOST }} \
              "DROP_BACKEND_VENV_ON_AI=1 KEEP_SUCCESSFUL_RELEASES=2 DRY_RUN=$DRY_RUN bash /tmp/cleanup-host-artifacts.sh"
          fi
