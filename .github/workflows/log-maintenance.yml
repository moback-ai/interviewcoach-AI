name: Log Maintenance

on:
  schedule:
    # Every Sunday 04:30 UTC (~10:00 IST) — weekly cleanup, keep 1 day of logs
    - cron: '30 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  LOG_ROOT: /apps/logs

jobs:
  archive_and_clean_logs:
    name: Archive and clean deployment logs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 400 ~/.ssh/deploy_key.pem
          echo 'SSH_OPTS=-i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15' >> "$GITHUB_ENV"

      - name: Run log maintenance on the API host
        run: |
          set -euo pipefail
          chmod +x scripts/log-maintenance.sh
          rsync -avz \
            -e "ssh $SSH_OPTS" \
            scripts/log-maintenance.sh \
            ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }}:/tmp/log-maintenance.sh

          ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} \
            "LOG_ROOT='${{ env.LOG_ROOT }}' RETENTION_DAYS='1' FILE_ZIP_THRESHOLD_BYTES='10485760' SIZE_LIMIT_BYTES='2147483648' KEEP_RECENT_LOGS='5' KEEP_ARCHIVES='3' FORCE_SUNDAY_CLEANUP='1' bash /tmp/log-maintenance.sh" \
            | tee "$RUNNER_TEMP/log-maintenance.json"

          {
            echo "## Log Maintenance"
            echo "- Log root: \`${{ env.LOG_ROOT }}\`"
            echo "- Retention: 1 day (Sunday weekly cleanup)"
            echo "- Per-file zip threshold: 10 MB"
            echo ""
            echo '```json'
            cat "$RUNNER_TEMP/log-maintenance.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
