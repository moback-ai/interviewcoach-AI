name: Security

# One job, one step — all free scanners run inside scripts/security-scan-all.sh

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: security-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Security scan
        env:
          SECURITY_SCAN_PROFILE: quick
        run: bash scripts/security-scan-all.sh
