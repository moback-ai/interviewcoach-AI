# Production deploy is DevSecOps-only — moback-ai/devsecops-platform
# This workflow intentionally does not deploy from the application repo.
name: Deploy · Auto (develop)

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  devsecops_only:
    name: DevSecOps deploy notice
    runs-on: ubuntu-latest
    steps:
      - name: No deploy from application repo
        run: |
          echo "Push to develop recorded. Security CI runs separately."
          echo "Production deploy: moback-ai/devsecops-platform → InterviewCoach · Deploy PROD"
          echo "Ask Govardhan or Kishore after merged PR approval."
