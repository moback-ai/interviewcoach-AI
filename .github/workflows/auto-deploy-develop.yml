name: Deploy · Auto (develop)

# Requires admin-approved PR → dispatches deploy.yml → production environment approval.

on:
  # Only integration merges — feature work runs Security on the PR, not deploy.
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch name to deploy (develop or develop/feat-*)
        required: true
        type: string
      git_sha:
        description: Optional commit SHA (defaults to branch tip)
        required: false
        type: string

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  deploy_trigger_gate:
    name: Deploy trigger gate
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Only merged PRs or manual dispatch
        id: check
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Manual deploy dispatch."
            exit 0
          fi
          msg="${{ github.event.head_commit.message }}"
          if printf '%s' "$msg" | grep -qiE 'Merge pull request|\(#[0-9]+\)'; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Merged PR commit on develop — continuing."
            exit 0
          fi
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          echo "Skipped: direct push to develop does not deploy. Merge an admin-approved PR (Option A) or use Deploy · Production (Option B)."

  validate_admin_pr_approval:
    name: Validate PR approval
    needs: [deploy_trigger_gate]
    if: needs.deploy_trigger_gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      source_branch: ${{ steps.meta.outputs.source_branch }}
      deploy_sha: ${{ steps.meta.outputs.deploy_sha }}
      approved_by: ${{ steps.meta.outputs.approved_by }}
      review_notes: ${{ steps.meta.outputs.review_notes }}
      deploy_kind: ${{ steps.meta.outputs.deploy_kind }}
    steps:
      - name: Resolve branch, SHA, and admin approval
        id: meta
        uses: actions/github-script@v7
        env:
          ADMINS: '["govardhanreddy66","KFKishore23"]'
          INPUT_REF: ${{ github.event.inputs.git_ref }}
          INPUT_SHA: ${{ github.event.inputs.git_sha }}
        with:
          script: |
            const admins = JSON.parse(process.env.ADMINS);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const ref =
              context.eventName === 'workflow_dispatch'
                ? process.env.INPUT_REF
                : context.ref.replace('refs/heads/', '');

            const sha =
              context.eventName === 'workflow_dispatch'
                ? process.env.INPUT_SHA || ''
                : context.sha;

            if (!ref || (ref !== 'develop' && !ref.startsWith('develop/'))) {
              core.setFailed('Only develop and develop/* branches can be deployed.');
              return;
            }

            const resolveSha = async () => {
              if (sha) {
                return sha;
              }
              const branch = await github.rest.repos.getBranch({ owner, repo, branch: ref });
              return branch.data.commit.sha;
            };

            const deploySha = await resolveSha();
            const isFeatureBranch = ref.startsWith('develop/') && ref !== 'develop';

            const activeAdminApprovals = async (pullNumber) => {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: pullNumber,
                per_page: 100,
              });
              const approvalState = new Map();
              for (const review of reviews) {
                const login = review.user?.login;
                if (!admins.includes(login)) {
                  continue;
                }
                if (review.state === 'APPROVED') {
                  approvalState.set(login, 'APPROVED');
                  continue;
                }
                if (review.state === 'CHANGES_REQUESTED' || review.state === 'DISMISSED') {
                  approvalState.delete(login);
                }
              }
              return admins.filter((login) => approvalState.get(login) === 'APPROVED');
            };

            let pullRequest;
            let approvedBy = '';
            let reviewNotes = '';

            if (isFeatureBranch) {
              const openPulls = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${owner}:${ref}`,
                base: 'develop',
              });
              if (!openPulls.data.length) {
                core.setFailed(
                  `No open PR from ${ref} to develop. Open a PR and get admin approval before deploy.`
                );
                return;
              }
              pullRequest = openPulls.data[0];
              const approvingAdmins = await activeAdminApprovals(pullRequest.number);
              if (!approvingAdmins.length) {
                core.setFailed(
                  `PR #${pullRequest.number} requires admin approval before deploy. Approvers: ${admins.join(', ')}`
                );
                return;
              }
              approvedBy = approvingAdmins[0];
              reviewNotes = `Feature deploy for PR #${pullRequest.number} approved by ${approvedBy}.`;
            } else {
              const commitMessage =
                context.payload.head_commit?.message || `workflow_dispatch ${ref}`;
              const findMergedPullRequest = async () => {
                const mergeMatch = commitMessage.match(/Merge pull request #(\d+)/i);
                if (mergeMatch) {
                  const pullNumber = Number(mergeMatch[1]);
                  const { data } = await github.rest.pulls.get({
                    owner,
                    repo,
                    pull_number: pullNumber,
                  });
                  if (data.base.ref === 'develop' && data.merged_at) {
                    return data;
                  }
                }

                const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner,
                  repo,
                  commit_sha: deploySha,
                });

                return associated.data
                  .filter((pr) => pr.base.ref === 'develop' && pr.merged_at)
                  .sort((left, right) => new Date(right.merged_at) - new Date(left.merged_at))[0];
              };

              pullRequest = await findMergedPullRequest();
              if (!pullRequest) {
                core.setFailed(
                  'develop deploy requires a merged PR into develop with admin approval. Direct pushes are not deployable.'
                );
                return;
              }

              const approvingAdmins = await activeAdminApprovals(pullRequest.number);
              if (!approvingAdmins.length) {
                core.setFailed(
                  `Merged PR #${pullRequest.number} does not have active admin approval. Deployment blocked.`
                );
                return;
              }
              approvedBy = approvingAdmins[0];
              reviewNotes = `Integration deploy for merged PR #${pullRequest.number} approved by ${approvedBy}.`;
            }

            const deployKind = isFeatureBranch ? 'feature-branch' : 'develop-integration';
            core.setOutput('source_branch', ref);
            core.setOutput('deploy_sha', deploySha);
            core.setOutput('approved_by', approvedBy);
            core.setOutput('review_notes', reviewNotes);
            core.setOutput('deploy_kind', deployKind);

            await core.summary
              .addHeading('Deploy request validated')
              .addRaw(`Branch: \`${ref}\``)
              .addBreak()
              .addRaw(`SHA: \`${deploySha}\``)
              .addBreak()
              .addRaw(`Admin approval: ${approvedBy}`)
              .addBreak()
              .addRaw(`Next: quality gate (lint, build, tests, merge conflicts), then production approval.`)
              .write();

  pre_deploy_quality:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [validate_admin_pr_approval]
    steps:
      - name: Gate · Scan, test, and conflict check
        uses: ./.github/actions/pre-deploy-quality-gate
        with:
          git_ref: ${{ needs.validate_admin_pr_approval.outputs.deploy_sha }}

  dispatch_production_deploy:
    name: Dispatch deploy
    runs-on: ubuntu-latest
    needs: [validate_admin_pr_approval, pre_deploy_quality]
    steps:
      - name: Dispatch deploy workflow
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = '${{ needs.validate_admin_pr_approval.outputs.source_branch }}';
            const sha = '${{ needs.validate_admin_pr_approval.outputs.deploy_sha }}';
            const approvedBy = '${{ needs.validate_admin_pr_approval.outputs.approved_by }}';
            const reviewNotes = '${{ needs.validate_admin_pr_approval.outputs.review_notes }}';
            const deployKind = '${{ needs.validate_admin_pr_approval.outputs.deploy_kind }}';

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'deploy.yml',
              ref: 'develop',
              inputs: {
                git_ref: sha,
                source_branch: ref,
                approved_by: approvedBy,
                branch_details: `[${deployKind}] branch=${ref}`,
                code_review_notes: reviewNotes,
                version_audit: 'true',
                deploy_target: 'auto',
              },
            });

            await core.summary
              .addHeading('Production deploy dispatched')
              .addRaw(`deploy.yml started for \`${ref}\` @ \`${sha}\`.`)
              .addBreak()
              .addRaw(`PR approved by: ${approvedBy}`)
              .addBreak()
              .addRaw(`Quality gate passed. Waiting for production environment approval in deploy.yml.`)
              .write();
