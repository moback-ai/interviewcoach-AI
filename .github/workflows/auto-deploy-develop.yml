# Production deploy is DevSecOps-only — moback-ai/devsecops-platform
# This workflow intentionally does not deploy from the application repo.
name: Deploy · Auto (release / develop)

on:
  push:
    branches:
      - develop
      - release/**

permissions:
  contents: read

jobs:
  devsecops_only:
    name: DevSecOps deploy notice
    runs-on: ubuntu-latest
    steps:
      - name: No deploy from application repo
        run: |
          echo "Push recorded. Security CI runs separately."
          echo "Production: moback-ai/devsecops-platform"
          echo "  → InterviewCoach · Build Production (release branch only)"
          echo "  → InterviewCoach · Deploy Production"
          echo "Ask Govardhan or Kishore after your PR is merged to release/<month>-<year>."
