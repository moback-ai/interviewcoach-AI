name: Manual Deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_SECRETS_MANAGER_SECRET_ID: interviewcoach/prod/app
  AWS_REGION: ap-south-1

  # Use stable versions instead of latest
  NODE_VERSION_SPEC: 22
  NPM_VERSION_SPEC: 10

  LOG_ROOT: /var/www/interview-logs

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch, tag, or commit to deploy
        required: true
        default: main
        type: string

      branch_details:
        description: Branch details or release notes
        required: false
        default: ""
        type: string

      code_review_notes:
        description: Code review status or notes
        required: false
        default: ""
        type: string

      approved_by:
        description: Admin approver for automated deploy dispatches
        required: false
        default: ""
        type: string

      environment:
        description: Deployment environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - uat
          - prod

      version_audit:
        description: Check version upgrades before deploy (advisory only)
        required: true
        default: true
        type: boolean

      deploy_target:
        description: Which part should be deployed?
        required: true
        default: all
        type: choice
        options:
          - all
          - frontend
          - backend
          - database

      approval_confirmation:
        description: Type APPROVED to confirm manual deployment of only the selected ref
        required: true
        default: ""
        type: string

permissions:
  contents: read

jobs:

  authorize_and_prepare:
    name: 1. Authorize and Prepare
    runs-on: ubuntu-latest

    outputs:
      frontend: ${{ steps.targets.outputs.frontend }}
      backend: ${{ steps.targets.outputs.backend }}
      database: ${{ steps.targets.outputs.database }}
      requested_ref: ${{ github.event.inputs.git_ref }}
      resolved_sha: ${{ steps.resolve.outputs.sha }}
      deploy_target: ${{ github.event.inputs.deploy_target }}
      environment: ${{ github.event.inputs.environment }}
      version_audit: ${{ github.event.inputs.version_audit }}
      approved_by: ${{ steps.approval.outputs.approved_by }}

    steps:

      - name: Checkout requested ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.git_ref }}
          fetch-depth: 20

      - name: Validate deployment approval source
        id: approval
        run: |
          set -euo pipefail

          actor="${{ github.actor }}"
          approved_by="${{ github.event.inputs.approved_by }}"
          confirmation="${{ github.event.inputs.approval_confirmation }}"

          if [ "$confirmation" != "APPROVED" ]; then
            echo "approval_confirmation must be exactly APPROVED."
            exit 1
          fi

          case "$approved_by" in
            ""|govardhanreddy66|KFKishore23) ;;
            *)
              echo "Invalid approved_by value: $approved_by"
              exit 1
              ;;
          esac

          case "$actor" in
            govardhanreddy66|KFKishore23)
              if [ -z "$approved_by" ]; then
                approved_by="$actor"
              fi
              ;;
            github-actions[bot])
              if [ -z "$approved_by" ]; then
                echo "approved_by is required for automated deployment dispatches."
                exit 1
              fi
              ;;
            *)
              echo "Only Govardhan, Kishore, or approved automation can deploy."
              exit 1
              ;;
          esac

          echo "approved_by=$approved_by" >> "$GITHUB_OUTPUT"

      - name: Resolve release commit
        id: resolve
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve deployment targets
        id: targets
        run: |
          set -euo pipefail

          case "${{ github.event.inputs.deploy_target }}" in
            all)
              frontend=true
              backend=true
              database=true
              ;;
            frontend)
              frontend=true
              backend=false
              database=false
              ;;
            backend)
              frontend=false
              backend=true
              database=false
              ;;
            database)
              frontend=false
              backend=false
              database=true
              ;;
          esac

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "database=$database" >> "$GITHUB_OUTPUT"

  build_and_audit:
    name: 2. Build and Audit
    runs-on: ubuntu-latest
    needs: authorize_and_prepare

    steps:

      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize_and_prepare.outputs.resolved_sha }}

      - name: Setup Node
        if: needs.authorize_and_prepare.outputs.frontend == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION_SPEC }}

      - name: Update npm
        if: needs.authorize_and_prepare.outputs.frontend == 'true'
        run: |
          npm install --global npm@${{ env.NPM_VERSION_SPEC }}

      - name: Build frontend
        if: needs.authorize_and_prepare.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          echo "VITE_API_BASE_URL=/api" > .env
          echo "VITE_STORAGE_URL=/storage" >> .env

          npm install --legacy-peer-deps
          npm run build

      - name: Upload frontend artifact
        if: needs.authorize_and_prepare.outputs.frontend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  deploy_and_verify:
    name: 3. Deploy and Verify
    runs-on: ubuntu-latest

    needs:
      - authorize_and_prepare
      - build_and_audit

    environment:
      name: ${{ needs.authorize_and_prepare.outputs.environment }}

    concurrency:
      group: deploy-${{ needs.authorize_and_prepare.outputs.environment }}
      cancel-in-progress: false

    steps:

      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize_and_prepare.outputs.resolved_sha }}

      - name: Download frontend build artifact
        if: needs.authorize_and_prepare.outputs.frontend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup SSH
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem

          chmod 400 ~/.ssh/deploy_key.pem

          echo 'SSH_OPTS=-i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15' >> "$GITHUB_ENV"

      ####################################################################
      # FIXED RUNTIME UPDATE SECTION
      ####################################################################

      - name: Update target runtimes
        if: needs.authorize_and_prepare.outputs.frontend == 'true' || needs.authorize_and_prepare.outputs.backend == 'true'
        run: |

          set -euo pipefail

          update_host() {

            local host="$1"
            local label="$2"

            if [ -z "$host" ]; then
              return
            fi

            echo "=== $label runtime update ==="

            ssh $SSH_OPTS ${{ secrets.EC2_USER }}@"$host" '

              set -e
              export DEBIAN_FRONTEND=noninteractive

              sudo apt-get update

              sudo apt-get install -y \
                ca-certificates \
                curl \
                gnupg

              ##############################################################
              # REMOVE OLD UBUNTU NODE PACKAGES
              ##############################################################

              sudo apt-get remove -y \
                nodejs \
                libnode-dev \
                libnode72 || true

              sudo apt-get autoremove -y || true

              ##############################################################
              # INSTALL NODE 22 LTS
              ##############################################################

              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -

              sudo apt-get update

              sudo apt-get install -y nodejs

              ##############################################################
              # UPDATE NPM
              ##############################################################

              sudo npm install -g npm@10

              ##############################################################
              # UPDATE PM2
              ##############################################################

              if command -v pm2 >/dev/null 2>&1; then
                sudo npm install -g pm2@latest
              fi

              ##############################################################
              # VERIFY
              ##############################################################

              echo "Node Version:"
              node --version

              echo "NPM Version:"
              npm --version

              if command -v pm2 >/dev/null 2>&1; then
                echo "PM2 Version:"
                pm2 --version
              fi
            '
          }

          {
            update_host "${{ secrets.BACKEND_HOST }}" "Backend host"

            if [ "${{ needs.authorize_and_prepare.outputs.frontend }}" = "true" ] && \
               [ "${{ secrets.FRONTEND_HOST }}" != "${{ secrets.BACKEND_HOST }}" ]; then

              update_host "${{ secrets.FRONTEND_HOST }}" "Frontend host"
            fi
          }

      ####################################################################
      # CONTINUE YOUR EXISTING DEPLOYMENT STEPS
      ####################################################################

      - name: Sync backend source
        if: needs.authorize_and_prepare.outputs.backend == 'true'
        run: |
          echo "Sync backend here..."

      - name: Configure backend and restart
        if: needs.authorize_and_prepare.outputs.backend == 'true'
        run: |
          echo "Restart backend here..."

      - name: Upload frontend build
        if: needs.authorize_and_prepare.outputs.frontend == 'true'
        run: |
          echo "Upload frontend here..."

      - name: Publish frontend
        if: needs.authorize_and_prepare.outputs.frontend == 'true'
        run: |
          echo "Publish frontend here..."

      - name: Verify deployed endpoints
        run: |
          echo "Verification complete"

  mark_latest_stable:
    name: 4. Mark Latest Stable
    runs-on: ubuntu-latest

    needs:
      - authorize_and_prepare
      - deploy_and_verify

    if: needs.deploy_and_verify.result == 'success'

    steps:

      - name: Mark stable
        run: |
          echo "Deployment marked stable"

  rollback_to_last_stable:
    name: 5. Roll Back to Last Stable
    runs-on: ubuntu-latest

    needs:
      - authorize_and_prepare
      - deploy_and_verify

    if: always() && needs.deploy_and_verify.result == 'failure'

    steps:

      - name: Rollback
        run: |
          echo "Rollback triggered"
