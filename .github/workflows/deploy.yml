  deploy_backend_box:
    name: ${{ needs.authorize_and_prepare.outputs.deploy_backend_name }}
    runs-on: ubuntu-latest
    needs: [authorize_and_prepare, build_and_audit, deploy_prepare]
    if: needs.authorize_and_prepare.outputs.backend == 'true'
    steps:
      - name: Backend · Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build_and_audit.outputs.release_sha }}

      - name: Backend · SSH + Env
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 400 ~/.ssh/deploy_key.pem
          echo 'SSH_OPTS=-i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15' >> "$GITHUB_ENV"
          echo "DEPLOY_LOG_FILE=${{ needs.deploy_prepare.outputs.deploy_log_file }}" >> "$GITHUB_ENV"

      - name: Backend · Toolchain
        run: |
          scp $SSH_OPTS scripts/deploy-host-toolchain.sh scripts/install-ffmpeg-8.sh \
            ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }}:/tmp/
          ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} \
            "INSTALL_FFMPEG=1 NODE_MAJOR=${{ env.NODE_MAJOR }} bash /tmp/deploy-host-toolchain.sh"

      - name: Backend · Snapshot stable release
        run: |
          log_to_remote() {
            ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} "cat >> '$DEPLOY_LOG_FILE'" 2>/dev/null || true
          }
          {
            echo "=== Snapshot backend stable (pre-deploy) ==="
            ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} '
              set -e
              APP_ROOT="/apps/backend"
              STABLE_LINK="$APP_ROOT/stable"
              CURRENT_RELEASE="$(readlink -f "$APP_ROOT/current" || true)"
              if [ -z "$(readlink -f "$STABLE_LINK" || true)" ] && [ -n "$CURRENT_RELEASE" ] && [ -d "$CURRENT_RELEASE" ]; then
                ln -sfn "$CURRENT_RELEASE" "$STABLE_LINK"
                echo "Recorded backend stable release: $CURRENT_RELEASE"
              fi
            '
          } 2>&1 | tee >(log_to_remote)

      - name: Backend · Sync source
        run: |
          log_to_remote() {
            ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} "cat >> '$DEPLOY_LOG_FILE'"
          }
          {
            echo "=== Sync backend source ==="
            BACKEND_RELEASE="/apps/backend/releases/${{ needs.build_and_audit.outputs.release_sha }}"
            ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} "mkdir -p $BACKEND_RELEASE"
            rsync -avz --delete \
              -e "ssh $SSH_OPTS" \
              backend/ \
              ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }}:$BACKEND_RELEASE/
          } 2>&1 | tee >(log_to_remote)

      - name: Backend · Configure and restart
        run: |
          log_to_remote() {
            ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} "cat >> '$DEPLOY_LOG_FILE'"
          }
          {
            echo "=== Configure backend and restart ==="
          ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} <<'EOFSSH'
          set -e
          RELEASE_ID="${{ needs.build_and_audit.outputs.release_sha }}"
          APP_ROOT="/apps/backend"
          RELEASES_DIR="$APP_ROOT/releases"
          VENV_DIR="$APP_ROOT/venv"
          STABLE_LINK="$APP_ROOT/stable"
          NEW_RELEASE="$RELEASES_DIR/$RELEASE_ID"
          STABLE_RELEASE="$(readlink -f "$STABLE_LINK" || readlink -f "$APP_ROOT/current" || true)"
          mkdir -p "$RELEASES_DIR"
          if [ ! -d "$VENV_DIR" ]; then python3 -m venv "$VENV_DIR"; fi
          . "$VENV_DIR/bin/activate"
          pip install --upgrade pip
          pip install -r "$NEW_RELEASE/requirements.txt"
          ln -sfn "$NEW_RELEASE" "$APP_ROOT/current"
          pm2 delete backend >/dev/null 2>&1 || true
          AWS_REGION=${{ env.AWS_REGION }} AWS_SECRETS_MANAGER_SECRET_ID=${{ env.AWS_SECRETS_MANAGER_SECRET_ID }} \
            pm2 start "cd $APP_ROOT/current && $VENV_DIR/bin/gunicorn -w 1 --threads 8 -b 0.0.0.0:5000 --timeout 300 --max-requests 2000 --max-requests-jitter 200 app:app" --name backend
          pm2 save
          sleep 5
          if ! curl -f http://127.0.0.1:5000/api/health; then
            pm2 status
            pm2 logs backend --lines 200 --nostream || true
            if [ -n "$STABLE_RELEASE" ] && [ -d "$STABLE_RELEASE" ]; then
              echo "Rolling back backend to stable release $STABLE_RELEASE"
              ln -sfn "$STABLE_RELEASE" "$APP_ROOT/current"
              pm2 delete backend >/dev/null 2>&1 || true
              AWS_REGION=${{ env.AWS_REGION }} AWS_SECRETS_MANAGER_SECRET_ID=${{ env.AWS_SECRETS_MANAGER_SECRET_ID }} \
                pm2 start "cd $APP_ROOT/current && $VENV_DIR/bin/gunicorn -w 1 --threads 8 -b 0.0.0.0:5000 --timeout 300 --max-requests 2000 --max-requests-jitter 200 app:app" --name backend
              pm2 save
              sleep 5
              curl -f http://127.0.0.1:5000/api/health
            fi
            exit 1
          fi
          EOFSSH
          } 2>&1 | tee >(log_to_remote)

  deploy_ai_box:
    name: ${{ needs.authorize_and_prepare.outputs.deploy_ai_name }}
    runs-on: ubuntu-latest
    needs: [authorize_and_prepare, build_and_audit, deploy_prepare]
    if: needs.authorize_and_prepare.outputs.ai == 'true'
    steps:
      - name: AI · Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build_and_audit.outputs.release_sha }}

      - name: AI · SSH + Env
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 400 ~/.ssh/deploy_key.pem
          echo 'SSH_OPTS=-i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15' >> "$GITHUB_ENV"
          echo "DEPLOY_LOG_FILE=${{ needs.deploy_prepare.outputs.deploy_log_file }}" >> "$GITHUB_ENV"

      - name: AI · Toolchain
        env:
          AI_HOST: ${{ secrets.AI_HOST }}
        run: |
          if [ -z "$AI_HOST" ]; then
            echo "AI_HOST GitHub secret is required for AI box deploy. Sync from AWS with scripts/aws-plan-b/sync-github-secrets.sh"
            exit 1
          fi
          scp $SSH_OPTS scripts/deploy-host-toolchain.sh ${{ secrets.EC2_USER }}@"$AI_HOST":/tmp/deploy-host-toolchain.sh
          ssh $SSH_OPTS ${{ secrets.EC2_USER }}@"$AI_HOST" \
            "NODE_MAJOR=${{ env.NODE_MAJOR }} bash /tmp/deploy-host-toolchain.sh"

      - name: AI · Refresh Ollama
        env:
          AI_HOST: ${{ secrets.AI_HOST }}
        run: |
          log_to_remote() {
            ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} "cat >> '$DEPLOY_LOG_FILE'" 2>/dev/null || true
          }
          {
            echo "=== Deploy AI box (Ollama) ==="
            scp $SSH_OPTS scripts/deploy-ai-host.sh ${{ secrets.EC2_USER }}@"$AI_HOST":/tmp/deploy-ai-host.sh
            ssh $SSH_OPTS ${{ secrets.EC2_USER }}@"$AI_HOST" \
              "OLLAMA_MODEL=llama3.2:3b OLLAMA_HEALTH_URL=http://127.0.0.1:11434/api/tags bash /tmp/deploy-ai-host.sh"
          } 2>&1 | tee >(log_to_remote)

  deploy_database_box:
    name: ${{ needs.authorize_and_prepare.outputs.deploy_database_name }}
    runs-on: ubuntu-latest
    needs: [authorize_and_prepare, build_and_audit, deploy_prepare]
    if: needs.authorize_and_prepare.outputs.database == 'true'
    steps:
      - name: Database · Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build_and_audit.outputs.release_sha }}

      - name: Database · SSH + Env
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 400 ~/.ssh/deploy_key.pem
          echo 'SSH_OPTS=-i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15' >> "$GITHUB_ENV"
          echo "DEPLOY_LOG_FILE=${{ needs.deploy_prepare.outputs.deploy_log_file }}" >> "$GITHUB_ENV"

      - name: Database · Sync migration source
        run: |
          log_to_remote() {
            ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} "cat >> '$DEPLOY_LOG_FILE'"
          }
          {
            echo "=== Sync database source ==="
            DATABASE_RELEASE="/apps/database/releases/${{ needs.build_and_audit.outputs.release_sha }}"
            ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} "mkdir -p $DATABASE_RELEASE"
            rsync -avz --delete \
              -e "ssh $SSH_OPTS" \
              database/ \
              ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }}:$DATABASE_RELEASE/
          } 2>&1 | tee >(log_to_remote)

      - name: Database · Apply migrations
        run: |
          log_to_remote() {
            ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} "cat >> '$DEPLOY_LOG_FILE'"
          }
          {
            echo "=== Apply database migrations ==="
          ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} <<'EOFSSH'
          set -e
          DATABASE_RELEASE="/apps/database/releases/${{ needs.build_and_audit.outputs.release_sha }}"
          export PGPASSWORD="${{ secrets.DB_PASSWORD }}"
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          SERVER_MAJOR="$(
            psql \
              --host="${{ secrets.DB_HOST }}" \
              --port="${{ secrets.DB_PORT }}" \
              --username="${{ secrets.DB_USER }}" \
              --dbname="${{ secrets.DB_NAME }}" \
              --tuples-only \
              --no-align \
              --command="SHOW server_version;" | cut -d. -f1 | tr -d '[:space:]'
          )"
          if [ -z "$SERVER_MAJOR" ]; then
            echo "Unable to detect PostgreSQL server version"
            exit 1
          fi
          PG_BINDIR="/usr/lib/postgresql/$SERVER_MAJOR/bin"
          if [ ! -x "$PG_BINDIR/pg_dump" ] || [ ! -x "$PG_BINDIR/psql" ] || [ ! -x "$PG_BINDIR/pg_restore" ]; then
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl gnupg lsb-release
            if [ ! -f /etc/apt/sources.list.d/pgdg.list ]; then
              echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | \
                sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            fi
            if [ ! -f /usr/share/keyrings/postgresql.gpg ]; then
              curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | \
                gpg --dearmor | sudo tee /usr/share/keyrings/postgresql.gpg >/dev/null
            fi
            sudo apt-get update
            sudo apt-get install -y "postgresql-client-$SERVER_MAJOR"
          fi
          BACKUP_FILE="/apps/database/backups/deploy-${{ github.run_id }}-${{ needs.build_and_audit.outputs.release_sha }}.dump"
          "$PG_BINDIR/pg_dump" \
            --host="${{ secrets.DB_HOST }}" \
            --port="${{ secrets.DB_PORT }}" \
            --username="${{ secrets.DB_USER }}" \
            --dbname="${{ secrets.DB_NAME }}" \
            --format=custom \
            --file="$BACKUP_FILE"
          restore_database() {
            echo "Rolling back database from $BACKUP_FILE"
            "$PG_BINDIR/pg_restore" \
              --host="${{ secrets.DB_HOST }}" \
              --port="${{ secrets.DB_PORT }}" \
              --username="${{ secrets.DB_USER }}" \
              --dbname="${{ secrets.DB_NAME }}" \
              --clean \
              --if-exists \
              --no-owner \
              --no-privileges \
              "$BACKUP_FILE"
          }
          trap restore_database ERR
          "$PG_BINDIR/psql" \
            --host="${{ secrets.DB_HOST }}" \
            --port="${{ secrets.DB_PORT }}" \
            --username="${{ secrets.DB_USER }}" \
            --dbname="${{ secrets.DB_NAME }}" \
            --set=ON_ERROR_STOP=1 \
            --command="
              CREATE TABLE IF NOT EXISTS schema_migrations (
                filename TEXT PRIMARY KEY,
                applied_at TIMESTAMPTZ NOT NULL DEFAULT now()
              );
            "
          MIGRATIONS_DIR="$DATABASE_RELEASE/migrations"
          if [ -d "$MIGRATIONS_DIR" ]; then
            for migration in $(find "$MIGRATIONS_DIR" -maxdepth 1 -type f -name '*.sql' | sort); do
              filename="$(basename "$migration")"
              already_applied="$(
                "$PG_BINDIR/psql" \
                  --host="${{ secrets.DB_HOST }}" \
                  --port="${{ secrets.DB_PORT }}" \
                  --username="${{ secrets.DB_USER }}" \
                  --dbname="${{ secrets.DB_NAME }}" \
                  --tuples-only \
                  --no-align \
                  --command="SELECT 1 FROM schema_migrations WHERE filename = '$filename' LIMIT 1;"
              )"
              if [ "$already_applied" = "1" ]; then
                echo "Skipping already applied migration: $filename"
                continue
              fi
              echo "Applying migration: $filename"
              "$PG_BINDIR/psql" \
                --host="${{ secrets.DB_HOST }}" \
                --port="${{ secrets.DB_PORT }}" \
                --username="${{ secrets.DB_USER }}" \
                --dbname="${{ secrets.DB_NAME }}" \
                --set=ON_ERROR_STOP=1 \
                --single-transaction \
                --file="$migration"
              "$PG_BINDIR/psql" \
                --host="${{ secrets.DB_HOST }}" \
                --port="${{ secrets.DB_PORT }}" \
                --username="${{ secrets.DB_USER }}" \
                --dbname="${{ secrets.DB_NAME }}" \
                --set=ON_ERROR_STOP=1 \
                --command="INSERT INTO schema_migrations (filename) VALUES ('$filename') ON CONFLICT (filename) DO NOTHING;"
            done
          else
            echo "No migrations directory found. Skipping database migration step."
          fi
          EOFSSH
          } 2>&1 | tee >(log_to_remote)


  deploy_finalize:
    name: ${{ needs.authorize_and_prepare.outputs.deployed_summary_name }}
    runs-on: ubuntu-latest
    needs:
      - resolve_context
      - authorize_and_prepare
      - build_and_audit
      - deploy_prepare
      - deploy_frontend_box
      - deploy_backend_box
      - deploy_ai_box
      - deploy_database_box
    if: always() && needs.deploy_prepare.result == 'success' && needs.authorize_and_prepare.outputs.has_targets == 'true'
    steps:
      - name: Deployed — SSH + Env
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 400 ~/.ssh/deploy_key.pem
          echo 'SSH_OPTS=-i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15' >> "$GITHUB_ENV"
          echo "DEPLOY_LOG_FILE=${{ needs.deploy_prepare.outputs.deploy_log_file }}" >> "$GITHUB_ENV"
          echo "FRONTEND_ORIGIN=${{ needs.deploy_prepare.outputs.frontend_origin }}" >> "$GITHUB_ENV"

      - name: Deployed — Summary
        id: report_status
        env:
          FRONTEND_DOMAIN: ${{ secrets.FRONTEND_DOMAIN || 'ugaanlabs.ai' }}
          FRONTEND_HOST: ${{ secrets.FRONTEND_HOST }}
        run: |
          {
            echo "## ${{ needs.authorize_and_prepare.outputs.deployed_summary_name }}"
            echo "### Deployed to"
            echo "- **${{ needs.authorize_and_prepare.outputs.deployed_to_list }}**"
            echo "- Release SHA: \`${{ needs.build_and_audit.outputs.release_sha }}\`"
            echo "- Requested ref: \`${{ needs.authorize_and_prepare.outputs.requested_ref }}\`"
            echo "- Deploy mode: \`${{ needs.authorize_and_prepare.outputs.deploy_target }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.authorize_and_prepare.outputs.frontend }}" = "true" ]; then
            curl -fsS --max-time 15 "$FRONTEND_ORIGIN/" >/dev/null
            echo "- Frontend check: success ($FRONTEND_ORIGIN/)" >> "$GITHUB_STEP_SUMMARY"
            login_html="$(curl -fsS --max-time 15 "$FRONTEND_ORIGIN/login")"
            if printf '%s' "$login_html" | grep -qE 'syntax-highlighter|framer-motion|recharts'; then
              echo "- Login smoke check: failed (entry still preloads heavy vendor chunks)" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            if ! printf '%s' "$login_html" | grep -q '/assets/index-'; then
              echo "- Login smoke check: failed (missing entry script on /login)" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "- Login smoke check: success ($FRONTEND_ORIGIN/login)" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.authorize_and_prepare.outputs.backend }}" = "true" ] || [ "${{ needs.authorize_and_prepare.outputs.frontend }}" = "true" ]; then
            curl -fsS --max-time 15 "$FRONTEND_ORIGIN/api/health" >/dev/null
            echo "- Backend health check: success ($FRONTEND_ORIGIN/api/health)" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.authorize_and_prepare.outputs.database }}" = "true" ]; then
            echo "- Database deployment stage completed. Review deploy logs for schema application details." >> "$GITHUB_STEP_SUMMARY"
          fi

            if [ "${{ needs.authorize_and_prepare.outputs.ai }}" = "true" ]; then
              echo "- AI box deploy job completed (Ollama refresh)." >> "$GITHUB_STEP_SUMMARY"
            fi

      - name: Finalize · Feature branch deploy succeeded (admin merge gate)
        if: >-
          success()
          && startsWith(needs.resolve_context.outputs.source_branch, 'develop/')
          && needs.resolve_context.outputs.source_branch != 'develop'
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sourceBranch = '${{ needs.resolve_context.outputs.source_branch }}';
            const sha = '${{ needs.build_and_audit.outputs.release_sha }}';
            const admins = ['govardhanreddy66', 'KFKishore23'];

            const pulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${sourceBranch}`,
              base: 'develop',
            });

            const body = [
              '✅ **Production deploy succeeded** for this feature branch.',
              '',
              `- Source branch: \`${sourceBranch}\``,
              `- Release SHA: \`${sha}\``,
              '',
              'An **admin** may now merge this pull request into `develop`.',
              'Automatic merges are disabled. If deploy had failed, do not merge.',
            ].join('\n');

            if (pulls.data.length === 0) {
              const { data: created } = await github.rest.pulls.create({
                owner,
                repo,
                title: `[deploy-verified] Merge ${sourceBranch} into develop`,
                head: sourceBranch,
                base: 'develop',
                draft: true,
                body,
              });
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: created.number,
                labels: ['deploy-verified', 'admin-merge-required'],
              });
              core.info(`Created draft PR #${created.number} for admin merge.`);
              return;
            }

            const pullRequest = pulls.data[0];
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pullRequest.number,
              body,
            });
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pullRequest.number,
              labels: ['deploy-verified', 'admin-merge-required'],
            });
            await github.rest.issues.removeLabel({
              owner,
              repo,
              issue_number: pullRequest.number,
              name: 'deploy-failed',
            }).catch(() => {});

            core.info(`Marked PR #${pullRequest.number} as deploy-verified. Admins: ${admins.join(', ')}`);

      - name: Finalize · Feature branch deploy failed (block merge)
        if: >-
          failure()
          && startsWith(needs.resolve_context.outputs.source_branch, 'develop/')
          && needs.resolve_context.outputs.source_branch != 'develop'
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sourceBranch = '${{ needs.resolve_context.outputs.source_branch }}';

            const pulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${sourceBranch}`,
              base: 'develop',
            });

            if (pulls.data.length === 0) {
              core.info(`No open PR found for ${sourceBranch}; nothing to mark as failed.`);
              return;
            }

            const pullRequest = pulls.data[0];
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pullRequest.number,
              body: [
                '❌ **Production deploy failed** for this feature branch.',
                '',
                `Do **not** merge into \`develop\` until deploy is fixed and succeeds.`,
                'Merges require admin approval and a successful deploy.',
              ].join('\n'),
            });
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pullRequest.number,
              labels: ['deploy-failed'],
            });
            await github.rest.issues.removeLabel({
              owner,
              repo,
              issue_number: pullRequest.number,
              name: 'deploy-verified',
            }).catch(() => {});

      - name: Finalize · Promote stable release
        if: >-
          success()
          && needs.deploy_frontend_box.result != 'failure'
          && needs.deploy_backend_box.result != 'failure'
          && needs.deploy_ai_box.result != 'failure'
          && needs.deploy_database_box.result != 'failure'
        continue-on-error: true
        run: |
          log_to_remote() {
            ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} "cat >> '$DEPLOY_LOG_FILE'"
          }
          {
            echo "=== Promote stable release ==="

            if [ "${{ needs.authorize_and_prepare.outputs.backend }}" = "true" ]; then
              ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} '
                set -e
                APP_ROOT="/apps/backend"
                CURRENT_RELEASE="$(readlink -f "$APP_ROOT/current" || true)"
                if [ -n "$CURRENT_RELEASE" ] && [ -d "$CURRENT_RELEASE" ]; then
                  ln -sfn "$CURRENT_RELEASE" "$APP_ROOT/stable"
                fi
              '
            fi

            if [ "${{ needs.authorize_and_prepare.outputs.frontend }}" = "true" ]; then
              ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.FRONTEND_HOST }} '
                set -e
                FRONTEND_ROOT="/var/www/interview"
                CURRENT_RELEASE="$(readlink -f "$FRONTEND_ROOT/current" || true)"
                if [ -n "$CURRENT_RELEASE" ] && [ -d "$CURRENT_RELEASE" ]; then
                  sudo ln -sfn "$CURRENT_RELEASE" "$FRONTEND_ROOT/stable"
                fi
              '
            fi

            ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} \
              "RELEASE_SHA='${{ needs.build_and_audit.outputs.release_sha }}' \
               REQUESTED_REF='${{ needs.authorize_and_prepare.outputs.requested_ref }}' \
               DEPLOY_TARGET='${{ needs.authorize_and_prepare.outputs.deploy_target }}' \
               DEPLOY_FRONTEND='${{ needs.authorize_and_prepare.outputs.frontend }}' \
               DEPLOY_BACKEND='${{ needs.authorize_and_prepare.outputs.backend }}' \
               DEPLOY_AI='${{ needs.authorize_and_prepare.outputs.ai }}' \
               DEPLOY_DATABASE='${{ needs.authorize_and_prepare.outputs.database }}' \
               bash -s" <<'EOFSSH'
          set -euo pipefail
          mkdir -p /apps/deployments/stable
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          payload = {
              "release_sha": os.environ["RELEASE_SHA"],
              "requested_ref": os.environ["REQUESTED_REF"],
              "deploy_target": os.environ["DEPLOY_TARGET"],
              "frontend": os.environ["DEPLOY_FRONTEND"],
              "backend": os.environ["DEPLOY_BACKEND"],
              "ai": os.environ.get("DEPLOY_AI", "false"),
              "database": os.environ["DEPLOY_DATABASE"],
              "deployed_at_utc": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          with open("/apps/deployments/stable/latest.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
              handle.write("\n")
          PY
          EOFSSH

            if [ "${{ needs.authorize_and_prepare.outputs.database }}" = "true" ]; then
              ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} \
                "rm -f '/apps/database/backups/deploy-${{ github.run_id }}-${{ needs.build_and_audit.outputs.release_sha }}.dump'"
            fi
          } 2>&1 | tee >(log_to_remote)

      - name: Finalize · Prune old releases, builds, and logs
        if: success()
        run: |
          log_to_remote() {
            ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} "cat >> '$DEPLOY_LOG_FILE'" 2>/dev/null || true
          }
          {
            echo "=== Prune old releases and logs ==="
            scp $SSH_OPTS scripts/cleanup-host-artifacts.sh scripts/log-maintenance.sh \
              ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }}:/tmp/
            ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} \
              "KEEP_SUCCESSFUL_RELEASES=2 LOG_RETENTION_DAYS=3 bash /tmp/cleanup-host-artifacts.sh"

            if [ "${{ needs.authorize_and_prepare.outputs.frontend }}" = "true" ]; then
              scp $SSH_OPTS scripts/cleanup-host-artifacts.sh scripts/log-maintenance.sh \
                ${{ secrets.EC2_USER }}@${{ secrets.FRONTEND_HOST }}:/tmp/
              ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.FRONTEND_HOST }} \
                "KEEP_SUCCESSFUL_RELEASES=2 LOG_RETENTION_DAYS=3 bash /tmp/cleanup-host-artifacts.sh"
            fi

            if [ "${{ needs.authorize_and_prepare.outputs.ai }}" = "true" ] && [ -n "${{ secrets.AI_HOST }}" ]; then
              scp $SSH_OPTS scripts/cleanup-host-artifacts.sh \
                ${{ secrets.EC2_USER }}@${{ secrets.AI_HOST }}:/tmp/
              ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.AI_HOST }} \
                "DROP_BACKEND_VENV_ON_AI=1 KEEP_SUCCESSFUL_RELEASES=2 bash /tmp/cleanup-host-artifacts.sh"
            fi
          } 2>&1 | tee >(log_to_remote)

      - name: Finalize · Roll back on failure
        if: >-
          failure()
          || needs.deploy_frontend_box.result == 'failure'
          || needs.deploy_backend_box.result == 'failure'
          || needs.deploy_ai_box.result == 'failure'
          || needs.deploy_database_box.result == 'failure'
        run: |
          log_to_remote() {
            ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} "cat >> '$DEPLOY_LOG_FILE'"
          }
          {
            echo "=== Roll back to last stable release ==="

            if [ "${{ needs.authorize_and_prepare.outputs.frontend }}" = "true" ]; then
              ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.FRONTEND_HOST }} '
                set -e
                FRONTEND_ROOT="/var/www/interview"
                STABLE_RELEASE="$(readlink -f "$FRONTEND_ROOT/stable" || true)"
                if [ -n "$STABLE_RELEASE" ] && [ -d "$STABLE_RELEASE" ]; then
                  echo "Restoring frontend stable release $STABLE_RELEASE"
                  sudo ln -sfn "$STABLE_RELEASE" "$FRONTEND_ROOT/current"
                  sudo nginx -t
                  sudo systemctl reload nginx
                fi
              '
            fi

            ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} <<'EOFSSH'
            set -e
            APP_ROOT="/apps/backend"
            CURRENT_LINK="$APP_ROOT/current"
            STABLE_LINK="$APP_ROOT/stable"
            VENV_DIR="$APP_ROOT/venv"
            BACKUP_FILE="/apps/database/backups/deploy-${{ github.run_id }}-${{ needs.build_and_audit.outputs.release_sha }}.dump"

            find_pg_bindir() {
              export PGPASSWORD="${{ secrets.DB_PASSWORD }}"
              SERVER_MAJOR="$(
                psql \
                  --host="${{ secrets.DB_HOST }}" \
                  --port="${{ secrets.DB_PORT }}" \
                  --username="${{ secrets.DB_USER }}" \
                  --dbname="${{ secrets.DB_NAME }}" \
                  --tuples-only \
                  --no-align \
                  --command="SHOW server_version;" | cut -d. -f1 | tr -d "[:space:]"
              )"
              echo "/usr/lib/postgresql/$SERVER_MAJOR/bin"
            }

            if [ "${{ needs.authorize_and_prepare.outputs.backend }}" = "true" ]; then
              STABLE_RELEASE="$(readlink -f "$STABLE_LINK" || true)"
              if [ -n "$STABLE_RELEASE" ] && [ -d "$STABLE_RELEASE" ]; then
                echo "Restoring backend stable release $STABLE_RELEASE"
                ln -sfn "$STABLE_RELEASE" "$CURRENT_LINK"
              fi
            fi

            if [ "${{ needs.authorize_and_prepare.outputs.database }}" = "true" ] && [ -f "$BACKUP_FILE" ]; then
              PG_BINDIR="$(find_pg_bindir)"
              pm2 delete backend >/dev/null 2>&1 || true
              "$PG_BINDIR/pg_restore" \
                --host="${{ secrets.DB_HOST }}" \
                --port="${{ secrets.DB_PORT }}" \
                --username="${{ secrets.DB_USER }}" \
                --dbname="${{ secrets.DB_NAME }}" \
                --clean \
                --if-exists \
                --no-owner \
                --no-privileges \
                "$BACKUP_FILE"
            fi

            if [ "${{ needs.authorize_and_prepare.outputs.backend }}" = "true" ] || [ "${{ needs.authorize_and_prepare.outputs.database }}" = "true" ]; then
              TARGET_RELEASE="$(readlink -f "$CURRENT_LINK" || true)"
              if [ -n "$TARGET_RELEASE" ] && [ -d "$TARGET_RELEASE" ]; then
                pm2 delete backend >/dev/null 2>&1 || true
                AWS_REGION=${{ env.AWS_REGION }} AWS_SECRETS_MANAGER_SECRET_ID=${{ env.AWS_SECRETS_MANAGER_SECRET_ID }} \
                  pm2 start "cd $APP_ROOT/current && $VENV_DIR/bin/gunicorn -w 1 --threads 8 -b 0.0.0.0:5000 --timeout 300 --max-requests 2000 --max-requests-jitter 200 app:app" --name backend
                pm2 save
                sleep 5
                curl -f http://127.0.0.1:5000/api/health
              fi
            fi
            EOFSSH
          } 2>&1 | tee >(log_to_remote)

      - name: Finalize · Verify production health after rollback
        if: >-
          failure()
          || needs.deploy_frontend_box.result == 'failure'
          || needs.deploy_backend_box.result == 'failure'
          || needs.deploy_ai_box.result == 'failure'
          || needs.deploy_database_box.result == 'failure'
        run: |
          set +e
          FRONTEND_ORIGIN="${{ needs.deploy_prepare.outputs.frontend_origin }}"
          if [ -n "$FRONTEND_ORIGIN" ]; then
            curl -fsS --max-time 20 "$FRONTEND_ORIGIN/api/health" && echo "Post-rollback health check passed."
          fi

      - name: Finalize · Maintain log archives
        if: always()
        run: |
          log_to_remote() {
            ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} "cat >> '$DEPLOY_LOG_FILE'"
          }
          {
            echo "=== Maintain log archives ==="
            ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} \
              "LOG_ROOT=/apps/logs RETENTION_DAYS=1 FILE_ZIP_THRESHOLD_BYTES=10485760 KEEP_RECENT_LOGS=5 KEEP_ARCHIVES=3 bash -s" \
              < scripts/log-maintenance.sh
          } 2>&1 | tee >(log_to_remote)
