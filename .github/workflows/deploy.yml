name: Deploy · Production

# Single workflow on merge to develop: resolve → approve production → security scan → deploy.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_SECRETS_MANAGER_SECRET_ID: interviewcoach/prod/app
  AWS_REGION: ap-south-1
  NODE_VERSION_SPEC: 24
  NPM_VERSION_SPEC: latest
  NODE_MAJOR: 24

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      git_ref:
        description: Commit SHA or ref to deploy
        required: true
        default: develop
        type: string
      source_branch:
        description: Source branch name (develop or develop/feature-name) for merge governance
        required: false
        default: develop
        type: string
      approved_by:
        description: Admin who approved the deploy (PR review + production environment)
        required: false
        default: ""
        type: string
      branch_details:
        description: Branch details or release notes
        required: false
        default: ""
        type: string
      code_review_notes:
        description: Code review status or notes
        required: false
        default: ""
        type: string
      version_audit:
        description: Check version upgrades before deploy (advisory only)
        required: true
        default: true
        type: boolean
      deploy_target:
        description: Which part should be deployed? (auto = only boxes with changed files)
        required: true
        default: auto
        type: choice
        options:
          - auto
          - all
          - frontend
          - backend
          - ai
          - database

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve_context:
    name: Resolve deploy context
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.resolve.outputs.proceed }}
      git_ref: ${{ steps.resolve.outputs.git_ref }}
      source_branch: ${{ steps.resolve.outputs.source_branch }}
      approved_by: ${{ steps.resolve.outputs.approved_by }}
      branch_details: ${{ steps.resolve.outputs.branch_details }}
      code_review_notes: ${{ steps.resolve.outputs.code_review_notes }}
      version_audit: ${{ steps.resolve.outputs.version_audit }}
      deploy_target: ${{ steps.resolve.outputs.deploy_target }}
    steps:
      - name: Resolve from event
        id: resolve
        uses: actions/github-script@v8
        env:
          INPUT_REF: ${{ github.event.inputs.git_ref }}
          INPUT_SOURCE: ${{ github.event.inputs.source_branch }}
          INPUT_APPROVED: ${{ github.event.inputs.approved_by }}
          INPUT_BRANCH_DETAILS: ${{ github.event.inputs.branch_details }}
          INPUT_REVIEW_NOTES: ${{ github.event.inputs.code_review_notes }}
          INPUT_VERSION_AUDIT: ${{ github.event.inputs.version_audit }}
          INPUT_DEPLOY_TARGET: ${{ github.event.inputs.deploy_target }}
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const setManual = () => {
              core.setOutput('proceed', 'true');
              core.setOutput('git_ref', process.env.INPUT_REF || 'develop');
              core.setOutput('source_branch', process.env.INPUT_SOURCE || 'develop');
              core.setOutput('approved_by', process.env.INPUT_APPROVED || '');
              core.setOutput('branch_details', process.env.INPUT_BRANCH_DETAILS || '');
              core.setOutput('code_review_notes', process.env.INPUT_REVIEW_NOTES || '');
              core.setOutput('version_audit', process.env.INPUT_VERSION_AUDIT !== 'false' ? 'true' : 'false');
              core.setOutput('deploy_target', process.env.INPUT_DEPLOY_TARGET || 'auto');
            };

            if (context.eventName === 'workflow_dispatch') {
              setManual();
              return;
            }

            const msg = process.env.HEAD_COMMIT_MSG || '';
            if (!/Merge pull request|\(#[0-9]+\)/i.test(msg)) {
              core.setOutput('proceed', 'false');
              core.info('Skipped: direct push to develop — merge a PR to deploy.');
              return;
            }

            const deploySha = context.sha;
            const ref = 'develop';
            let pullRequest;
            const mergeMatch = msg.match(/Merge pull request #(\d+)/i);
            if (mergeMatch) {
              const { data } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: Number(mergeMatch[1]),
              });
              if (data.base.ref === 'develop' && data.merged_at) {
                pullRequest = data;
              }
            }
            if (!pullRequest) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: deploySha,
              });
              pullRequest = associated.data
                .filter((pr) => pr.base.ref === 'develop' && pr.merged_at)
                .sort((a, b) => new Date(b.merged_at) - new Date(a.merged_at))[0];
            }
            if (!pullRequest) {
              core.setFailed('develop deploy requires a merged PR into develop.');
              return;
            }

            core.setOutput('proceed', 'true');
            core.setOutput('git_ref', deploySha);
            core.setOutput('source_branch', ref);
            core.setOutput('approved_by', 'develop-auto-deploy');
            core.setOutput('branch_details', `[develop-integration] branch=${ref}`);
            core.setOutput('code_review_notes', `Merged PR #${pullRequest.number} — approve production to deploy.`);
            core.setOutput('version_audit', 'true');
            core.setOutput('deploy_target', 'auto');

            await core.summary
              .addHeading('Deploy · merged to develop')
              .addRaw(`PR #${pullRequest.number} @ \`${deploySha.substring(0, 7)}\``)
              .addBreak()
              .addRaw('Approve **production** below to deploy.')
              .write();

  authorize_and_prepare:
    name: Authorize
    runs-on: ubuntu-latest
    needs: [resolve_context]
    if: needs.resolve_context.outputs.proceed == 'true'
    outputs:
      frontend: ${{ steps.targets.outputs.frontend }}
      backend: ${{ steps.targets.outputs.backend }}
      ai: ${{ steps.targets.outputs.ai }}
      database: ${{ steps.targets.outputs.database }}
      has_targets: ${{ steps.targets.outputs.has_targets }}
      requested_ref: ${{ needs.resolve_context.outputs.git_ref }}
      deploy_target: ${{ needs.resolve_context.outputs.deploy_target }}
      version_audit: ${{ needs.resolve_context.outputs.version_audit }}
      deploy_frontend_name: ${{ steps.targets.outputs.deploy_frontend_name }}
      deploy_backend_name: ${{ steps.targets.outputs.deploy_backend_name }}
      deploy_ai_name: ${{ steps.targets.outputs.deploy_ai_name }}
      deploy_database_name: ${{ steps.targets.outputs.deploy_database_name }}
      deployed_summary_name: ${{ steps.targets.outputs.deployed_summary_name }}
      deployed_to_list: ${{ steps.targets.outputs.deployed_to_list }}

    steps:
      - name: Authorize · Record Request
        run: |
          {
            echo "## Authorize"
            echo "### Deployment Request"
            echo "- Requested by: \`${{ github.actor }}\`"
            echo "- Triggering actor: \`${{ github.triggering_actor || github.actor }}\`"
            echo "- Deployment will continue only after protected environment approval."
            echo "- The deployment will resolve the newest commit on the requested ref after approval, so the run always uses the latest approved code at start time."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Authorize · Checkout Selected Branch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve_context.outputs.git_ref }}
          fetch-depth: 20

      - name: Authorize · Capture Branch Details and Code Review Notes
        run: |
          {
            echo "- Requested ref: \`${{ needs.resolve_context.outputs.git_ref }}\`"
            echo "- Source branch: \`${{ needs.resolve_context.outputs.source_branch }}\`"
            echo "- Approved by: \`${{ needs.resolve_context.outputs.approved_by || 'manual dispatch' }}\`"
            echo "- Deploy target: \`${{ needs.resolve_context.outputs.deploy_target }}\`"
            echo "- Failed deploys roll back to the last stable release; failed code is not promoted."
            echo "- Branch details: ${{ needs.resolve_context.outputs.branch_details || 'Not provided' }}"
            echo "- Code review notes: ${{ needs.resolve_context.outputs.code_review_notes || 'Not provided' }}"
            echo "- Requested by: \`${{ github.actor }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Authorize · Detect Changed Areas
        id: changes
        uses: dorny/paths-filter@v4
        with:
          base: develop
          ref: ${{ needs.resolve_context.outputs.git_ref }}
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
              - '!backend/INTERVIEW/**'
              - '!backend/Piper/**'
            ai:
              - 'setup.sh'
              - 'scripts/server-repair.sh'
              - 'scripts/deploy-ai-host.sh'
              - 'backend/INTERVIEW/**'
              - 'backend/Piper/**'
            database:
              - 'database/**'

      - name: Authorize · Resolve Deployment Targets
        id: targets
        env:
          FRONTEND_HOST: ${{ secrets.FRONTEND_HOST }}
          BACKEND_HOST: ${{ secrets.BACKEND_HOST }}
          AI_HOST: ${{ secrets.AI_HOST }}
          DB_HOST: ${{ secrets.DB_HOST }}
        run: |
          target="${{ needs.resolve_context.outputs.deploy_target }}"
          changed_frontend="${{ steps.changes.outputs.frontend }}"
          changed_backend="${{ steps.changes.outputs.backend }}"
          changed_ai="${{ steps.changes.outputs.ai }}"
          changed_database="${{ steps.changes.outputs.database }}"

          case "$target" in
            auto)
              frontend=$changed_frontend
              backend=$changed_backend
              ai=$changed_ai
              database=$changed_database
              ;;
            all)
              frontend=true
              backend=true
              ai=true
              database=true
              ;;
            frontend)
              frontend=true
              backend=false
              ai=false
              database=false
              ;;
            backend)
              frontend=false
              backend=true
              ai=false
              database=false
              ;;
            ai)
              frontend=false
              backend=false
              ai=true
              database=false
              ;;
            database)
              frontend=false
              backend=false
              ai=false
              database=true
              ;;
            *)
              echo "Unknown deploy_target: $target"
              exit 1
              ;;
          esac

          has_targets=false
          if [ "$frontend" = "true" ] || [ "$backend" = "true" ] || [ "$ai" = "true" ] || [ "$database" = "true" ]; then
            has_targets=true
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "ai=$ai" >> "$GITHUB_OUTPUT"
          echo "database=$database" >> "$GITHUB_OUTPUT"
          echo "has_targets=$has_targets" >> "$GITHUB_OUTPUT"

          deploy_frontend_name=""
          deploy_backend_name=""
          deploy_ai_name=""
          deploy_database_name=""
          deployed_to_list=""

          if [ "$frontend" = "true" ]; then
            host="${FRONTEND_HOST:-frontend-box}"
            deploy_frontend_name="Frontend · ${host}"
            deployed_to_list="${deployed_to_list}Frontend (${host}), "
          fi
          if [ "$backend" = "true" ]; then
            host="${BACKEND_HOST:-backend-api-box}"
            deploy_backend_name="Backend · ${host}"
            deployed_to_list="${deployed_to_list}Backend/API (${host}), "
          fi
          if [ "$ai" = "true" ]; then
            host="${AI_HOST:-ai-box}"
            deploy_ai_name="AI · ${host}"
            deployed_to_list="${deployed_to_list}AI (${host}), "
          fi
          if [ "$database" = "true" ]; then
            host="${DB_HOST:-rds}"
            deploy_database_name="Database · RDS ${host}"
            deployed_to_list="${deployed_to_list}Database (RDS ${host}), "
          fi

          deployed_to_list="${deployed_to_list%, }"
          deployed_summary_name="Finalize · ${deployed_to_list:-nothing}"

          echo "deploy_frontend_name=$deploy_frontend_name" >> "$GITHUB_OUTPUT"
          echo "deploy_backend_name=$deploy_backend_name" >> "$GITHUB_OUTPUT"
          echo "deploy_ai_name=$deploy_ai_name" >> "$GITHUB_OUTPUT"
          echo "deploy_database_name=$deploy_database_name" >> "$GITHUB_OUTPUT"
          echo "deployed_summary_name=$deployed_summary_name" >> "$GITHUB_OUTPUT"
          echo "deployed_to_list=$deployed_to_list" >> "$GITHUB_OUTPUT"

          echo "Resolved targets -> frontend=$frontend backend=$backend ai=$ai database=$database has_targets=$has_targets"
          {
            echo "### Deploy plan"
            echo "- Mode: \`$target\`"
            if [ -n "$deploy_frontend_name" ]; then echo "- \`$deploy_frontend_name\`"; fi
            if [ -n "$deploy_backend_name" ]; then echo "- \`$deploy_backend_name\`"; fi
            if [ -n "$deploy_ai_name" ]; then echo "- \`$deploy_ai_name\`"; fi
            if [ -n "$deploy_database_name" ]; then echo "- \`$deploy_database_name\`"; fi
            echo "- Final: \`$deployed_summary_name\`"
            echo "### Changed Areas On Selected Ref"
            echo "- Frontend: \`$changed_frontend\`"
            echo "- Backend (API): \`$changed_backend\`"
            echo "- AI / Ollama: \`$changed_ai\`"
            echo "- Database: \`$changed_database\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deployment_approval:
    name: Approve production
    runs-on: ubuntu-latest
    needs: [resolve_context, authorize_and_prepare]
    environment:
      name: production
    steps:
      - name: Approve · Verify admin gate
        env:
          ADMINS: govardhanreddy66,KFKishore23
        run: |
          APPROVED_BY="${{ needs.resolve_context.outputs.approved_by }}"
          ACTOR="${{ github.triggering_actor || github.actor }}"
          IFS=',' read -r -a ADMINS <<< "$ADMINS"

          if [ -n "$APPROVED_BY" ]; then
            gate="PR approval recorded ($APPROVED_BY) plus production environment approval"
          else
            allowed=0
            for admin in "${ADMINS[@]}"; do
              if [ "$ACTOR" = "$admin" ]; then
                allowed=1
                break
              fi
            done
            if [ "$allowed" -ne 1 ]; then
              echo "Manual deploy requires an admin actor or prior auto-deploy-develop approval."
              exit 1
            fi
            gate="manual admin dispatch ($ACTOR)"
          fi

          {
            echo "## Approve"
            echo "- Deployment approved through protected \`production\` environment."
            echo "- Approval gate: $gate"
            echo "- Environment approver: \`$ACTOR\`"
            echo "- On failure, production is restored to the last stable release."
          } >> "$GITHUB_STEP_SUMMARY"

  security_scan:
    name: Security scan
    runs-on: ubuntu-latest
    needs: [resolve_context, authorize_and_prepare, deployment_approval]
    if: needs.resolve_context.outputs.proceed == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize_and_prepare.outputs.requested_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Security scan
        env:
          SECURITY_SCAN_PROFILE: full
        run: bash scripts/security-scan-all.sh

  build_and_audit:
    name: Build & audit
    runs-on: ubuntu-latest
    needs: [authorize_and_prepare, deployment_approval, security_scan]
    outputs:
      release_sha: ${{ steps.resolve.outputs.release_sha }}
      release_ref: ${{ steps.resolve.outputs.release_ref }}
    steps:
      - name: Build · Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build · Resolve Approved Release
        id: resolve
        run: |
          REQUESTED_REF="${{ needs.authorize_and_prepare.outputs.requested_ref }}"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          if [ -n "$REQUESTED_REF" ]; then
            git fetch --no-tags origin "$REQUESTED_REF" --depth=1 || true
          fi
          git fetch --no-tags origin "$DEFAULT_BRANCH" --depth=1 || true
          if git rev-parse --verify --quiet "origin/$REQUESTED_REF" >/dev/null; then
            RELEASE_REF="origin/$REQUESTED_REF"
            RELEASE_SHA="$(git rev-parse "origin/$REQUESTED_REF")"
          else
            RELEASE_REF="$REQUESTED_REF"
            RELEASE_SHA="$(git rev-parse "$REQUESTED_REF")"
          fi
          echo "release_ref=$RELEASE_REF" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "## Build"
            echo "- Resolved commit: \`$RELEASE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build · Checkout Release
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.release_sha }}

      - name: Build · Validate Tooling
        run: |
          python3 --version
          node --version
          npm --version
          echo "- Python, Node, and npm are available on the runner." >> "$GITHUB_STEP_SUMMARY"

      - name: Build · Audit Frontend Dependency Versions
        if: needs.authorize_and_prepare.outputs.version_audit == 'true'
        working-directory: frontend
        run: |
          {
            echo "### Frontend Version Audit"
            echo "- package manager: npm"
            echo "- package file: \`frontend/package.json\`"
            echo ""
            echo '```'
            npm outdated --long || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build · Audit Backend Dependency Versions
        if: needs.authorize_and_prepare.outputs.version_audit == 'true'
        run: |
          python3 <<'PY'
          import json
          import re
          import urllib.request
          from pathlib import Path

          requirements = []
          for raw_line in Path("backend/requirements.txt").read_text().splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.match(r"([A-Za-z0-9_.-]+)(==|>=)(.+)", line)
              if not match:
                  continue
              requirements.append((match.group(1), match.group(2), match.group(3).strip()))

          rows = []
          for package, operator, current in requirements:
              latest = "unknown"
              try:
                  with urllib.request.urlopen(f"https://pypi.org/pypi/{package}/json", timeout=10) as response:
                      payload = json.load(response)
                  latest = payload.get("info", {}).get("version", "unknown")
              except Exception as exc:
                  latest = f"lookup failed: {exc}"
              rows.append((package, operator, current, latest))

          with open(Path.home() / "backend_version_audit.md", "w", encoding="utf-8") as handle:
              handle.write("### Backend Version Audit\n")
              handle.write("- package manager: pip requirements\n")
              handle.write("- package file: `backend/requirements.txt`\n\n")
              handle.write("| Package | Current constraint | Latest on PyPI |\n")
              handle.write("| --- | --- | --- |\n")
              for package, operator, current, latest in rows:
                  handle.write(f"| {package} | {operator}{current} | {latest} |\n")
          PY
          cat "$HOME/backend_version_audit.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Build · Note Upgrade Policy
        if: needs.authorize_and_prepare.outputs.version_audit == 'true'
        run: |
          {
            echo "### Upgrade Policy"
            echo "- Ubuntu, database engine, and app dependency upgrades are reported here for review."
            echo "- This workflow auto-updates Node.js and npm during deployment."
            echo "- This workflow does not auto-upgrade production OS packages, RDS/PostgreSQL, or app dependencies."
            echo "- Apply infrastructure upgrades in a separate approved maintenance window."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build · Setup Node
        if: needs.authorize_and_prepare.outputs.frontend == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION_SPEC }}

      - name: Build · Update npm
        if: needs.authorize_and_prepare.outputs.frontend == 'true'
        run: |
          NPM_TARGET="${{ env.NPM_VERSION_SPEC }}"
          # Do not run `corepack enable` — it symlinks into /usr/local/bin and fails on EC2 (EACCES).
          if ! corepack prepare "npm@${NPM_TARGET}" --activate 2>/dev/null; then
            npm install -g "npm@${NPM_TARGET}" || true
          fi
          hash -r
          {
            echo "- Build runner Node.js: \`$(node --version)\`"
            echo "- Build runner npm: \`$(npm --version)\` (target: ${NPM_TARGET})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build · Build Frontend
        if: needs.authorize_and_prepare.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          echo "VITE_API_BASE_URL=/api" > .env
          echo "VITE_STORAGE_URL=/storage" >> .env
          npm install --legacy-peer-deps
          npm run build
          bash ../scripts/verify-frontend-login-bundle.sh dist
          {
            echo "- Frontend build completed successfully."
            echo "- Login bundle guard: passed (no heavy vendor chunks in entry)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build · Upload Frontend Artifact
        if: needs.authorize_and_prepare.outputs.frontend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

      - name: Build · Skip Frontend Build When Not Requested
        if: needs.authorize_and_prepare.outputs.frontend != 'true'
        run: |
          echo "Frontend build skipped because deploy target does not include frontend."
          {
            echo "- Frontend build skipped."
          } >> "$GITHUB_STEP_SUMMARY"

  no_deploy_targets:
    name: Skip (no changes)
    runs-on: ubuntu-latest
    needs: authorize_and_prepare
    if: needs.authorize_and_prepare.outputs.has_targets != 'true'
    steps:
      - name: Skip · Nothing To Deploy
        run: |
          {
            echo "## Skip"
            echo "- Mode: \`${{ needs.authorize_and_prepare.outputs.deploy_target }}\`"
            echo "- No frontend, backend, AI, or database paths changed on the selected ref."
            echo "- All deploy box jobs were skipped."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy_prepare:
    name: Prepare
    runs-on: ubuntu-latest
    needs: [authorize_and_prepare, build_and_audit, deployment_approval]
    if: needs.authorize_and_prepare.outputs.has_targets == 'true'
    outputs:
      deploy_log_file: ${{ steps.deploy_log.outputs.deploy_log_file }}
      frontend_origin: ${{ steps.deploy_log.outputs.frontend_origin }}
    concurrency:
      group: deploy-feature-test-code-db-production
      cancel-in-progress: false
    steps:
      - name: Prepare · Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build_and_audit.outputs.release_sha }}

      - name: Prepare · Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 400 ~/.ssh/deploy_key.pem
          echo 'SSH_OPTS=-i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15' >> "$GITHUB_ENV"
          {
            echo "## Prepare"
            echo "- Release SHA: \`${{ needs.build_and_audit.outputs.release_sha }}\`"
            echo "- Frontend host: \`${{ secrets.FRONTEND_HOST }}\`"
            echo "- Backend/API host: \`${{ secrets.BACKEND_HOST }}\`"
            echo "- AI host: \`${{ secrets.AI_HOST }}\`"
            echo "- Deploy mode: \`${{ needs.authorize_and_prepare.outputs.deploy_target }}\`"
            echo "- Boxes: frontend=\`${{ needs.authorize_and_prepare.outputs.frontend }}\` backend=\`${{ needs.authorize_and_prepare.outputs.backend }}\` ai=\`${{ needs.authorize_and_prepare.outputs.ai }}\` database=\`${{ needs.authorize_and_prepare.outputs.database }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare · Deployment Log
        id: deploy_log
        env:
          FRONTEND_DOMAIN: ${{ secrets.FRONTEND_DOMAIN || 'ugaanlabs.ai' }}
          FRONTEND_HOST: ${{ secrets.FRONTEND_HOST }}
        run: |
          FRONTEND_DOMAIN="${FRONTEND_DOMAIN#http://}"
          FRONTEND_DOMAIN="${FRONTEND_DOMAIN#https://}"
          FRONTEND_DOMAIN="${FRONTEND_DOMAIN%%/*}"
          if [ -n "$FRONTEND_DOMAIN" ]; then
            FRONTEND_ORIGIN="https://$FRONTEND_DOMAIN"
          else
            FRONTEND_ORIGIN="http://$FRONTEND_HOST"
          fi
          DEPLOY_LOG_FILE="/apps/logs/live/deploy-${{ github.run_id }}.log"
          ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} "\
            mkdir -p /apps/logs/live /apps/logs/archive /apps/logs/tmp /apps/deployments/runs /apps/deployments/stable /apps/database/backups && \
            touch '$DEPLOY_LOG_FILE' && \
            ln -sfn '$DEPLOY_LOG_FILE' /apps/logs/live/deploy-current.log"
          echo "deploy_log_file=$DEPLOY_LOG_FILE" >> "$GITHUB_OUTPUT"
          echo "frontend_origin=$FRONTEND_ORIGIN" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_LOG_FILE=$DEPLOY_LOG_FILE" >> "$GITHUB_ENV"
          echo "FRONTEND_ORIGIN=$FRONTEND_ORIGIN" >> "$GITHUB_ENV"

  deploy_frontend_box:
    name: ${{ needs.authorize_and_prepare.outputs.deploy_frontend_name }}
    runs-on: ubuntu-latest
    needs: [authorize_and_prepare, build_and_audit, deploy_prepare]
    if: needs.authorize_and_prepare.outputs.frontend == 'true'
    steps:
      - name: Frontend · Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build_and_audit.outputs.release_sha }}

      - name: Frontend · SSH + Env
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 400 ~/.ssh/deploy_key.pem
          echo 'SSH_OPTS=-i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15' >> "$GITHUB_ENV"
          echo "DEPLOY_LOG_FILE=${{ needs.deploy_prepare.outputs.deploy_log_file }}" >> "$GITHUB_ENV"
          echo "FRONTEND_ORIGIN=${{ needs.deploy_prepare.outputs.frontend_origin }}" >> "$GITHUB_ENV"

      - name: Frontend · Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Frontend · Toolchain
        run: |
          scp $SSH_OPTS scripts/deploy-host-toolchain.sh ${{ secrets.EC2_USER }}@${{ secrets.FRONTEND_HOST }}:/tmp/deploy-host-toolchain.sh
          ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.FRONTEND_HOST }} \
            "NODE_MAJOR=${{ env.NODE_MAJOR }} bash /tmp/deploy-host-toolchain.sh"

      - name: Frontend · Prepare nginx logs snippet
        run: |
          LOGS_PROXY_HOST="127.0.0.1:5001"
          if [ -n "${{ secrets.API_PRIVATE_IP }}" ]; then
            LOGS_PROXY_HOST="${{ secrets.API_PRIVATE_IP }}:5000"
          fi
          BACKEND_PROXY_HOST="$LOGS_PROXY_HOST" bash scripts/nginx-logs-locations.sh > /tmp/nginx-logs.snippet

      - name: Frontend · Upload nginx logs snippet
        run: |
          scp $SSH_OPTS /tmp/nginx-logs.snippet \
            ${{ secrets.EC2_USER }}@${{ secrets.FRONTEND_HOST }}:/tmp/nginx-logs.snippet

      - name: Frontend · Snapshot stable release
        run: |
          log_to_remote() {
            ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} "cat >> '$DEPLOY_LOG_FILE'" 2>/dev/null || true
          }
          {
            echo "=== Snapshot frontend stable (pre-deploy) ==="
            ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.FRONTEND_HOST }} '
              set -e
              FRONTEND_ROOT="/var/www/interview"
              STABLE_LINK="$FRONTEND_ROOT/stable"
              CURRENT_RELEASE="$(readlink -f "$FRONTEND_ROOT/current" || true)"
              if [ -z "$(readlink -f "$STABLE_LINK" || true)" ] && [ -n "$CURRENT_RELEASE" ] && [ -d "$CURRENT_RELEASE" ]; then
                sudo ln -sfn "$CURRENT_RELEASE" "$STABLE_LINK"
                echo "Recorded frontend stable release: $CURRENT_RELEASE"
              fi
            '
          } 2>&1 | tee >(log_to_remote)

      - name: Frontend · Upload build
        run: |
          log_to_remote() {
            ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} "cat >> '$DEPLOY_LOG_FILE'"
          }
          {
            echo "=== Upload frontend build ==="
            rsync -avz --delete \
              -e "ssh $SSH_OPTS" \
              frontend/dist/ \
              ${{ secrets.EC2_USER }}@${{ secrets.FRONTEND_HOST }}:/tmp/frontend-dist/
          } 2>&1 | tee >(log_to_remote)

      - name: Frontend · Publish release
        run: |
          log_to_remote() {
            ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }} "cat >> '$DEPLOY_LOG_FILE'"
          }
          {
            echo "=== Publish frontend ==="
          ssh $SSH_OPTS ${{ secrets.EC2_USER }}@${{ secrets.FRONTEND_HOST }} <<'EOFSSH'
          set -e
          RELEASE_ID="${{ needs.build_and_audit.outputs.release_sha }}"
          FRONTEND_ROOT="/var/www/interview"
          RELEASES_DIR="$FRONTEND_ROOT/releases"
          CURRENT_LINK="$FRONTEND_ROOT/current"
          STABLE_LINK="$FRONTEND_ROOT/stable"
          STABLE_RELEASE="$(readlink -f "$STABLE_LINK" || readlink -f "$CURRENT_LINK" || true)"
          NEW_RELEASE="$RELEASES_DIR/$RELEASE_ID"
          APP_DOMAIN="${{ secrets.FRONTEND_DOMAIN }}"
          BACKEND_HOST="${{ secrets.BACKEND_HOST }}"
          BACKEND_TUNNEL_KEY="/tmp/backend-tunnel-key.pem"
          API_PRIVATE_IP="${{ secrets.API_PRIVATE_IP }}"
          BACKEND_PROXY_HOST="127.0.0.1:5001"
          if [ -n "$API_PRIVATE_IP" ]; then
            BACKEND_PROXY_HOST="${API_PRIVATE_IP}:5000"
          fi
          sudo mkdir -p "$RELEASES_DIR"
          sudo rsync -av --delete /tmp/frontend-dist/ "$NEW_RELEASE/"
          if [ -z "$APP_DOMAIN" ]; then
            DETECTED_CERT_DIR="$(find /etc/letsencrypt/live -mindepth 1 -maxdepth 1 -type d ! -name 'README' | head -n 1 || true)"
            if [ -n "$DETECTED_CERT_DIR" ]; then
              APP_DOMAIN="$(basename "$DETECTED_CERT_DIR")"
              echo "FRONTEND_DOMAIN secret missing, auto-detected HTTPS domain: $APP_DOMAIN"
            fi
          fi
          if [ -z "$APP_DOMAIN" ]; then
            APP_DOMAIN="ugaanlabs.ai"
          fi
          APP_DOMAIN="${APP_DOMAIN#http://}"
          APP_DOMAIN="${APP_DOMAIN#https://}"
          APP_DOMAIN="${APP_DOMAIN%%/*}"
          has_ssl_cert() {
            [ -n "$APP_DOMAIN" ] &&
              sudo test -f "/etc/letsencrypt/live/$APP_DOMAIN/fullchain.pem" &&
              sudo test -f "/etc/letsencrypt/live/$APP_DOMAIN/privkey.pem"
          }
          SERVER_NAMES="$APP_DOMAIN"
          case "$APP_DOMAIN" in
            www.*) ;;
            *) SERVER_NAMES="$APP_DOMAIN www.$APP_DOMAIN" ;;
          esac
          cat > "$BACKEND_TUNNEL_KEY" <<'KEYEOF'
          ${{ secrets.EC2_SSH_KEY }}
          KEYEOF
          chmod 600 "$BACKEND_TUNNEL_KEY"
          if [ "$BACKEND_PROXY_HOST" = "127.0.0.1:5001" ]; then
            EXISTING_TUNNEL_PID="$(ss -ltnp 2>/dev/null | awk '/127.0.0.1:5001/ && /ssh/ { if (match($0, /pid=([0-9]+)/, pid)) print pid[1] }' | head -n 1)"
            if [ -n "$EXISTING_TUNNEL_PID" ]; then
              kill "$EXISTING_TUNNEL_PID" || true
              sleep 1
            fi
            ssh -f -N -L 127.0.0.1:5001:127.0.0.1:5000 \
              -i "$BACKEND_TUNNEL_KEY" \
              -o ExitOnForwardFailure=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=3 \
              ${{ secrets.EC2_USER }}@"$BACKEND_HOST"
          fi
          for i in $(seq 1 10); do
            if curl -fsS --max-time 5 "http://$BACKEND_PROXY_HOST/api/health" >/dev/null; then
              break
            fi
            sleep 2
          done
          export APP_DOMAIN
          export SERVER_NAMES
          export BACKEND_PROXY_HOST
          if has_ssl_cert; then
            {
              echo "server {"
              echo "    listen 80;"
              echo "    server_name $SERVER_NAMES;"
              echo '    return 301 https://$host$request_uri;'
              echo "}"
              echo
              echo "server {"
              echo "    listen 443 ssl http2;"
              echo "    server_name $SERVER_NAMES;"
              echo
              echo "    ssl_certificate /etc/letsencrypt/live/$APP_DOMAIN/fullchain.pem;"
              echo "    ssl_certificate_key /etc/letsencrypt/live/$APP_DOMAIN/privkey.pem;"
              echo "    gzip on;"
              echo '    gzip_vary on;'
              echo '    gzip_proxied any;'
              echo '    gzip_comp_level 6;'
              echo '    gzip_min_length 1024;'
              echo '    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml text/xml image/svg+xml;'
              echo
              echo "    root $CURRENT_LINK;"
              echo "    index index.html;"
              echo
              echo '    location = /.env { return 404; }'
              echo '    location ^~ /.git/ { return 404; }'
              echo '    location ^~ /.svn/ { return 404; }'
              echo '    location ^~ /.hg/ { return 404; }'
              echo '    location ^~ /vendor/ { return 404; }'
              echo '    location ^~ /cgi-bin/ { return 404; }'
              echo '    location ^~ /wp-admin/ { return 404; }'
              echo '    location ^~ /wp-content/ { return 404; }'
              echo '    location ^~ /wp-includes/ { return 404; }'
              echo '    location ^~ /phpunit/ { return 404; }'
              echo '    location ^~ /phpMyAdmin/ { return 404; }'
              echo '    location ^~ /.well-known/pki-validation/ { return 404; }'
              echo '    location ~* \\.(php|asp|aspx|jsp|cgi|pl|sh)$ { return 404; }'
              echo
              echo "    location = /index.html {"
              echo '        add_header Cache-Control "no-store, no-cache, must-revalidate" always;'
              echo '        try_files $uri =404;'
              echo "    }"
              echo
              echo "    location ~* \\.(js|mjs|css|map|json|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {"
              echo '        try_files $uri =404;'
              echo '        expires 1y;'
              echo '        add_header Cache-Control "public, immutable" always;'
              echo "    }"
              echo
              if [ -f /tmp/nginx-logs.snippet ]; then
                cat /tmp/nginx-logs.snippet
              fi
              echo "    location / {"
              echo '        add_header Cache-Control "no-store, no-cache, must-revalidate" always;'
              echo '        try_files $uri $uri/ /index.html;'
              echo "    }"
              echo
              echo "    location /api/ {"
              echo "        proxy_pass http://$BACKEND_PROXY_HOST/api/;"
              echo '        proxy_set_header Host $host;'
              echo '        proxy_set_header X-Real-IP $remote_addr;'
              echo '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;'
              echo '        proxy_set_header X-Forwarded-Proto $scheme;'
              echo "        proxy_read_timeout 300s;"
              echo "        client_max_body_size 200M;"
              echo "    }"
              echo
              echo "    location /functions/v1/ {"
              echo "        proxy_pass http://$BACKEND_PROXY_HOST/functions/v1/;"
              echo '        proxy_set_header Host $host;'
              echo '        proxy_set_header X-Real-IP $remote_addr;'
              echo '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;'
              echo '        proxy_set_header X-Forwarded-Proto $scheme;'
              echo "        proxy_read_timeout 300s;"
              echo "        client_max_body_size 200M;"
              echo "    }"
              echo
              echo "    location /socket.io/ {"
              echo "        proxy_pass http://$BACKEND_PROXY_HOST/socket.io/;"
              echo "        proxy_http_version 1.1;"
              echo '        proxy_set_header Upgrade $http_upgrade;'
              echo '        proxy_set_header Connection "upgrade";'
              echo '        proxy_set_header Host $host;'
              echo '        proxy_set_header X-Forwarded-Proto $scheme;'
              echo "        proxy_read_timeout 300s;"
              echo "    }"
              echo "}"
            } >/tmp/interview-nginx.conf
          else
            {
              echo "server {"
              echo "    listen 80;"
              echo "    server_name _;"
              echo "    gzip on;"
              echo '    gzip_vary on;'
              echo '    gzip_proxied any;'
              echo '    gzip_comp_level 6;'
              echo '    gzip_min_length 1024;'
              echo '    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml text/xml image/svg+xml;'
              echo
              echo "    root $CURRENT_LINK;"
              echo "    index index.html;"
              echo
              echo '    location = /.env { return 404; }'
              echo '    location ^~ /.git/ { return 404; }'
              echo '    location ^~ /.svn/ { return 404; }'
              echo '    location ^~ /.hg/ { return 404; }'
              echo '    location ^~ /vendor/ { return 404; }'
              echo '    location ^~ /cgi-bin/ { return 404; }'
              echo '    location ^~ /wp-admin/ { return 404; }'
              echo '    location ^~ /wp-content/ { return 404; }'
              echo '    location ^~ /wp-includes/ { return 404; }'
              echo '    location ^~ /phpunit/ { return 404; }'
              echo '    location ^~ /phpMyAdmin/ { return 404; }'
              echo '    location ^~ /.well-known/pki-validation/ { return 404; }'
              echo '    location ~* \\.(php|asp|aspx|jsp|cgi|pl|sh)$ { return 404; }'
              echo
              echo "    location = /index.html {"
              echo '        add_header Cache-Control "no-store, no-cache, must-revalidate" always;'
              echo '        try_files $uri =404;'
              echo "    }"
              echo
              echo "    location ~* \\.(js|mjs|css|map|json|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {"
              echo '        try_files $uri =404;'
              echo '        expires 1y;'
              echo '        add_header Cache-Control "public, immutable" always;'
              echo "    }"
              echo
              if [ -f /tmp/nginx-logs.snippet ]; then
                cat /tmp/nginx-logs.snippet
              fi
              echo "    location / {"
              echo '        add_header Cache-Control "no-store, no-cache, must-revalidate" always;'
              echo '        try_files $uri $uri/ /index.html;'
              echo "    }"
              echo
              echo "    location /api/ {"
              echo "        proxy_pass http://$BACKEND_PROXY_HOST/api/;"
              echo '        proxy_set_header Host $host;'
              echo '        proxy_set_header X-Real-IP $remote_addr;'
              echo '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;'
              echo '        proxy_set_header X-Forwarded-Proto $scheme;'
              echo "        proxy_read_timeout 300s;"
              echo "        client_max_body_size 200M;"
              echo "    }"
              echo
              echo "    location /functions/v1/ {"
              echo "        proxy_pass http://$BACKEND_PROXY_HOST/functions/v1/;"
              echo '        proxy_set_header Host $host;'
              echo '        proxy_set_header X-Real-IP $remote_addr;'
              echo '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;'
              echo '        proxy_set_header X-Forwarded-Proto $scheme;'
              echo "        proxy_read_timeout 300s;"
              echo "        client_max_body_size 200M;"
              echo "    }"
              echo
              echo "    location /socket.io/ {"
              echo "        proxy_pass http://$BACKEND_PROXY_HOST/socket.io/;"
              echo "        proxy_http_version 1.1;"
              echo '        proxy_set_header Upgrade $http_upgrade;'
              echo '        proxy_set_header Connection "upgrade";'
              echo '        proxy_set_header Host $host;'
              echo '        proxy_set_header X-Forwarded-Proto $scheme;'
              echo "        proxy_read_timeout 300s;"
              echo "    }"
              echo "}"
            } >/tmp/interview-nginx.conf
          fi
          sudo mv /tmp/interview-nginx.conf /etc/nginx/sites-available/interview
          sudo ln -sf /etc/nginx/sites-available/interview /etc/nginx/sites-enabled/interview
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo ln -sfn "$NEW_RELEASE" "$CURRENT_LINK"
          sudo nginx -t
          sudo systemctl reload nginx
          frontend_check() {
            local html=""
            if has_ssl_cert; then
              html="$(curl -kfsS --max-time 10 \
                --resolve "$APP_DOMAIN:443:127.0.0.1" \
                "https://$APP_DOMAIN/login")"
            else
              html="$(curl -fsS --max-time 10 http://127.0.0.1/login)"
            fi
            if printf '%s' "$html" | grep -qE 'syntax-highlighter|framer-motion|recharts'; then
              echo "Login bundle smoke check failed: heavy vendor chunk referenced in HTML"
              return 1
            fi
            if ! printf '%s' "$html" | grep -q '/assets/index-'; then
              echo "Login bundle smoke check failed: missing entry script"
              return 1
            fi
          }
          if ! frontend_check || ! curl -fsS --max-time 10 "http://$BACKEND_PROXY_HOST/api/health" >/dev/null; then
            if [ -n "$STABLE_RELEASE" ] && [ -d "$STABLE_RELEASE" ]; then
              echo "Rolling back frontend to stable release $STABLE_RELEASE"
              sudo ln -sfn "$STABLE_RELEASE" "$CURRENT_LINK"
              sudo nginx -t
              sudo systemctl reload nginx
            fi
            exit 1
          fi
          EOFSSH
