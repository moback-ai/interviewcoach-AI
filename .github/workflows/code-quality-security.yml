name: Security

# PR: security gate must pass before merge (lint, tests, audits, gitleaks).
# Full scans (CodeQL, Trivy, Semgrep, e2e): weekly cron or manual dispatch.
# Deploy workflow re-runs security gate before production SSH.

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-security-gate:
    name: PR security gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

      - name: Run security gate
        uses: ./.github/actions/security-gate
        with:
          scan_frontend: ${{ steps.changes.outputs.frontend == 'true' }}
          scan_backend: ${{ steps.changes.outputs.backend == 'true' }}
          check_merge_conflicts: 'true'

  full-scan:
    name: Full security scan
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate governance files
        run: |
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.load_file(file); puts "ok #{file}" }' .github/workflows/*.yml
          bash -n scripts/log-maintenance.sh
          bash -n scripts/cleanup-host-artifacts.sh
          bash -n scripts/verify-frontend-login-bundle.sh

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint -- --max-warnings 0

      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Frontend production build + login bundle guard
        working-directory: frontend
        run: |
          echo "VITE_API_BASE_URL=/api" > .env
          echo "VITE_STORAGE_URL=/storage" >> .env
          npm run build
          bash ../scripts/verify-frontend-login-bundle.sh dist

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: E2E smoke — login and forgot-password
        working-directory: frontend
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          preview_pid=$!
          for attempt in $(seq 1 45); do
            if curl -fsS "$PLAYWRIGHT_BASE_URL/login" >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS "$PLAYWRIGHT_BASE_URL/login" >/dev/null
          npm run test:e2e
          kill "$preview_pid" || true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend dependency install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install bandit pip-audit pytest

      - name: Backend unit tests
        run: python -m pytest backend/tests/ -q

      - name: Security scan (Python dependencies)
        run: bash scripts/pip-audit-production.sh

      - name: Security scan (Python source)
        run: bandit -c .github/bandit.yml -r backend -lll

  codeql:
    name: CodeQL (SAST)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Install frontend for CodeQL
        if: matrix.language == 'javascript-typescript'
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Install backend for CodeQL
        if: matrix.language == 'python'
        run: pip install -r backend/requirements.txt

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  trivy:
    name: Trivy (CVE scan)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Trivy
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/trivy.tar.gz \
            https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C "$HOME/.local/bin" trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Filesystem vulnerability scan
        run: |
          trivy fs . \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --skip-dirs backend/Piper,frontend/node_modules,frontend/dist,.git \
            --ignorefile .trivyignore \
            --format table

  semgrep:
    name: Semgrep (SAST rules)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Semgrep CI rules
        run: semgrep scan --config p/ci --error

  secret-scan-full:
    name: Secret scan (Gitleaks)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks CLI
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Gitleaks detect
        run: gitleaks detect --source . --config .gitleaks.toml --verbose
