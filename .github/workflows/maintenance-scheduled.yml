name: Maintenance · Scheduled

on:
  push:
    paths:
      - '.github/workflows/maintenance-scheduled.yml'
      - '.github/actions/setup-deploy-ssh/**'
  schedule:
    - cron: '0 2 * * *'    # Daily — prune GitHub Actions runs
    - cron: '30 3 * * *'   # Daily — expire abandoned checkout intents
    - cron: '30 4 * * 0'   # Sunday — log cleanup
    - cron: '0 4 * * 0'    # Sunday — host artifact cleanup
    - cron: '0 3 1 * *'    # 1st of month — stale branches
    - cron: '0 5 1 * *'    # 1st of month — develop → main sync
  workflow_dispatch:
    inputs:
      task:
        description: Task to run
        type: choice
        options:
          - all
          - logs
          - host-cleanup
          - branch-cleanup
          - sync-main
          - actions-cleanup
          - checkout-expiry
        default: all
      dry_run:
        description: Host cleanup dry run (no deletes)
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  # GitHub validates workflow files on push; without this job, all conditional jobs skip → false failure.
  workflow_file_push_guard:
    if: github.event_name == 'push'
    name: Workflow file push (no-op)
    runs-on: ubuntu-latest
    steps:
      - name: Not a maintenance run
        run: |
          echo "Maintenance runs on schedule or workflow_dispatch only."
          echo "No host or git tasks ran for this push."

  actions-runs-cleanup:
    name: GitHub Actions · prune runs
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'all' || github.event.inputs.task == 'actions-cleanup'))
      || github.event.schedule == '0 2 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prune old and failed runs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          chmod +x scripts/cleanup-github-actions-runs.sh
          ./scripts/cleanup-github-actions-runs.sh --max 10 --days 2

  logs:
    name: Logs · archive and trim
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'all' || github.event.inputs.task == 'logs'))
      || github.event.schedule == '30 4 * * 0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-deploy-ssh
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

      - name: Run on API host
        env:
          LOG_ROOT: /apps/logs
        run: |
          set -euo pipefail
          chmod +x scripts/log-maintenance.sh
          rsync -avz -e "ssh $SSH_OPTS" scripts/log-maintenance.sh \
            "${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }}:/tmp/log-maintenance.sh"
          ssh $SSH_OPTS "${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }}" \
            "LOG_ROOT='$LOG_ROOT' RETENTION_DAYS='1' FILE_ZIP_THRESHOLD_BYTES='10485760' SIZE_LIMIT_BYTES='2147483648' KEEP_RECENT_LOGS='5' KEEP_ARCHIVES='3' FORCE_SUNDAY_CLEANUP='1' bash /tmp/log-maintenance.sh" \
            | tee "$RUNNER_TEMP/log-maintenance.json"
          echo "## Logs" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/log-maintenance.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  checkout-intents-expiry:
    name: Checkout · expire stale intents
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'all' || github.event.inputs.task == 'checkout-expiry'))
      || github.event.schedule == '30 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-deploy-ssh
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

      - name: Expire stale checkout intents on API host
        env:
          CHECKOUT_MAINTENANCE_TOKEN: ${{ secrets.CHECKOUT_MAINTENANCE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CHECKOUT_MAINTENANCE_TOKEN:-}" ]; then
            echo "CHECKOUT_MAINTENANCE_TOKEN not set; skipping checkout expiry"
            exit 0
          fi
          ssh $SSH_OPTS "${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }}" \
            "curl -fsS -X POST 'http://127.0.0.1:5000/api/internal/checkout-intents/expire-stale' \
              -H 'X-Internal-Token: ${CHECKOUT_MAINTENANCE_TOKEN}' \
              -H 'Content-Type: application/json'"

  host-cleanup:
    name: Hosts · prune old releases
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'all' || github.event.inputs.task == 'host-cleanup'))
      || github.event.schedule == '0 4 * * 0'
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-deploy-ssh
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

      - name: Backend host
        run: |
          set -euo pipefail
          scp $SSH_OPTS scripts/cleanup-host-artifacts.sh scripts/log-maintenance.sh \
            "${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }}:/tmp/"
          ssh $SSH_OPTS "${{ secrets.EC2_USER }}@${{ secrets.BACKEND_HOST }}" \
            "KEEP_SUCCESSFUL_RELEASES=2 DRY_RUN=$DRY_RUN bash /tmp/cleanup-host-artifacts.sh"

      - name: Frontend host
        run: |
          set -euo pipefail
          scp $SSH_OPTS scripts/cleanup-host-artifacts.sh scripts/log-maintenance.sh \
            "${{ secrets.EC2_USER }}@${{ secrets.FRONTEND_HOST }}:/tmp/"
          ssh $SSH_OPTS "${{ secrets.EC2_USER }}@${{ secrets.FRONTEND_HOST }}" \
            "KEEP_SUCCESSFUL_RELEASES=2 DRY_RUN=$DRY_RUN bash /tmp/cleanup-host-artifacts.sh"

      - name: AI host
        env:
          AI_HOST: ${{ secrets.AI_HOST }}
        if: env.AI_HOST != ''
        run: |
          set -euo pipefail
          scp $SSH_OPTS scripts/cleanup-host-artifacts.sh \
            "${{ secrets.EC2_USER }}@${{ secrets.AI_HOST }}:/tmp/"
          ssh $SSH_OPTS "${{ secrets.EC2_USER }}@${{ secrets.AI_HOST }}" \
            "DROP_BACKEND_VENV_ON_AI=1 KEEP_SUCCESSFUL_RELEASES=2 DRY_RUN=$DRY_RUN bash /tmp/cleanup-host-artifacts.sh"

  branch-cleanup:
    name: Git · delete stale merged branches
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'all' || github.event.inputs.task == 'branch-cleanup'))
      || github.event.schedule == '0 3 1 * *'
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup develop/* branches
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const integrationBranch = 'develop';
            const staleDays = 30;
            const cutoff = new Date(Date.now() - staleDays * 24 * 60 * 60 * 1000);
            const deletedBranches = [];
            const reviewBranches = [];

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              protected: false,
              per_page: 100,
            });

            for (const branch of branches) {
              const name = branch.name;
              if (!name.startsWith('develop/') || name === integrationBranch) {
                continue;
              }

              const commit = await github.rest.repos.getCommit({
                owner,
                repo,
                ref: branch.commit.sha,
              });

              const committedAt = new Date(
                commit.data.commit.committer?.date || commit.data.commit.author?.date
              );

              if (committedAt > cutoff) {
                continue;
              }

              const comparison = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: integrationBranch,
                head: name,
              });

              if (['behind', 'identical'].includes(comparison.data.status)) {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${name}` });
                deletedBranches.push(`${name} (${committedAt.toISOString().slice(0, 10)})`);
              } else {
                reviewBranches.push(`${name} (${committedAt.toISOString().slice(0, 10)})`);
              }
            }

            await core.summary
              .addHeading('Branch cleanup')
              .addRaw(`Threshold: ${staleDays} days`)
              .addHeading('Deleted', 3)
              .addList(deletedBranches.length ? deletedBranches : ['None'])
              .addHeading('Needs review', 3)
              .addList(reviewBranches.length ? reviewBranches : ['None'])
              .write();

  sync-main:
    name: Git · monthly develop → main
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'all' || github.event.inputs.task == 'sync-main'))
      || github.event.schedule == '0 5 1 * *'
    runs-on: ubuntu-latest
    steps:
      - name: Merge develop into main
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const month = new Date().toISOString().slice(0, 7);
            const title = `chore: monthly sync main from develop (${month})`;

            await github.rest.repos.getBranch({ owner, repo, branch: 'develop' });

            const openPulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:develop`,
              base: 'main',
            });

            let pullRequest = openPulls.data[0];
            if (!pullRequest) {
              const { data: created } = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head: 'develop',
                base: 'main',
                body: [
                  'Scheduled monthly promotion of `develop` into `main`.',
                  'Does not deploy — production deploys from `develop` only.',
                ].join('\n'),
              });
              pullRequest = created;
            }

            const { data: merged } = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pullRequest.number,
              merge_method: 'merge',
              commit_title: title,
            });

            if (!merged.merged) {
              core.setFailed(`Could not merge PR #${pullRequest.number}: ${merged.message}`);
              return;
            }

            await core.summary
              .addHeading('Monthly sync')
              .addRaw(`Merged PR #${pullRequest.number} → \`${merged.sha}\``)
              .write();
