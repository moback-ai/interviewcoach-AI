# InterviewCoach PROD — nginx with Let's Encrypt (applied after certbot).
# Managed paths: /etc/letsencrypt/live/ugaanlabs.ai/

# www → apex (always HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ugaanlabs.ai;

    ssl_certificate /etc/letsencrypt/live/ugaanlabs.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ugaanlabs.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://ugaanlabs.ai$request_uri;
}

# Primary site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ugaanlabs.ai;

    ssl_certificate /etc/letsencrypt/live/ugaanlabs.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ugaanlabs.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/interview;
    index index.html;

    client_max_body_size 200m;

    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /functions/ {
        proxy_pass http://127.0.0.1:5000/functions/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ugaanlabs.ai www.ugaanlabs.ai;
    return 301 https://ugaanlabs.ai$request_uri;
}

# Direct IP (smoke tests)
