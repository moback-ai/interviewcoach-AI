AWSTemplateFormatVersion: "2010-09-09"
Description: InterviewCoach PROD — single API EC2 (Docker + Redis sidecar). Replaces Plan B 3-host layout.

Parameters:
  InstanceType:
    Type: String
    Default: c6i.large
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: interviewcoach-key-v2
  AmiId:
    Type: AWS::EC2::Image::Id
    Default: ami-0a1b0c508e1fa9fce
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  InstanceProfileName:
    Type: String
    Default: InterviewCoachBackendSecretsProfile
  VolumeSizeGb:
    Type: Number
    Default: 100
    MinValue: 30

Resources:
  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: interviewcoach-prod-api-sg
      GroupDescription: InterviewCoach PROD API (HTTP/HTTPS for CloudFront; no public :5000)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH — restrict via 10c-harden-api-security-group.sh
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP for CloudFront API origin (nginx)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS direct access / certbot
      Tags:
        - Key: Name
          Value: interviewcoach-prod-api-sg

  ApiInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref SubnetId
      IamInstanceProfile: !Ref InstanceProfileName
      SecurityGroupIds:
        - !Ref ApiSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref VolumeSizeGb
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: interviewcoach-api
        - Key: Environment
          Value: prod
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y docker.io docker-compose-v2 awscli curl
          systemctl enable docker
          systemctl start docker
          usermod -aG docker ubuntu
          mkdir -p /apps/interviewcoach /apps/storage /apps/logs
          chown -R ubuntu:ubuntu /apps

Outputs:
  InstanceId:
    Value: !Ref ApiInstance
  PublicIp:
    Value: !GetAtt ApiInstance.PublicIp
  PrivateIp:
    Value: !GetAtt ApiInstance.PrivateIp
  SecurityGroupId:
    Value: !Ref ApiSecurityGroup
