AWSTemplateFormatVersion: "2010-09-09"
Description: InterviewCoach PROD - ALB + ASG (c6i.xlarge) + ElastiCache Redis.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: CommaDelimitedList
    Description: Public subnets in 2+ AZs for ALB and API instances
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: interviewcoach-key-v2
  AmiId:
    Type: AWS::EC2::Image::Id
    Default: ami-0a1b0c508e1fa9fce
  InstanceType:
    Type: String
    Default: c6i.xlarge
    AllowedValues:
      - c6i.large
      - c6i.xlarge
      - c6i.2xlarge
  InstanceProfileName:
    Type: String
    Default: InterviewCoachBackendSecretsProfile
  EcrRegistry:
    Type: String
    Description: ECR registry host (no repository suffix)
  ImageTag:
    Type: String
    Default: prod
  ApiLogGroup:
    Type: String
    Default: /interviewcoach/prod/api
    Description: CloudWatch Logs group for API container (awslogs driver)
  DesiredCapacity:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 8
  MinSize:
    Type: Number
    Default: 2
  MaxSize:
    Type: Number
    Default: 4
  CacheNodeType:
    Type: String
    Default: cache.t3.small
  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Existing RDS security group — API and Redis access added via rules below

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: interviewcoach-prod-alb-sg
      GroupDescription: InterviewCoach PROD ALB (HTTP from internet / CloudFront)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: interviewcoach-prod-alb-sg

  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: interviewcoach-prod-api-asg-sg
      GroupDescription: InterviewCoach PROD API ASG - HTTP from ALB only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: HTTP from ALB
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH - restrict via 10c-harden-api-security-group.sh
      Tags:
        - Key: Name
          Value: interviewcoach-prod-api-asg-sg

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: interviewcoach-prod-redis-sg
      GroupDescription: InterviewCoach PROD ElastiCache Redis
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref ApiSecurityGroup
          Description: Redis from API ASG
      Tags:
        - Key: Name
          Value: interviewcoach-prod-redis-sg

  RdsIngressFromApi:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ApiSecurityGroup
      Description: PostgreSQL from Hybrid API ASG

  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: InterviewCoach prod Redis subnets
      SubnetIds: !Ref PublicSubnetIds
      CacheSubnetGroupName: interviewcoach-prod-redis-subnets

  RedisReplicationGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupId: interviewcoach-prod-redis
      ReplicationGroupDescription: InterviewCoach PROD Redis
      Engine: redis
      EngineVersion: "7.1"
      CacheNodeType: !Ref CacheNodeType
      NumCacheClusters: 2
      AutomaticFailoverEnabled: true
      MultiAZEnabled: true
      CacheSubnetGroupName: !Ref CacheSubnetGroup
      SecurityGroupIds:
        - !Ref RedisSecurityGroup
      PreferredMaintenanceWindow: sun:05:00-sun:06:00
      SnapshotRetentionLimit: 1
      Tags:
        - Key: Name
          Value: interviewcoach-prod-redis

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: interviewcoach-prod-alb
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets: !Ref PublicSubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: interviewcoach-prod-alb

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: interviewcoach-prod-api-tg
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckPath: /api/health
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  AlbHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  ApiLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: interviewcoach-prod-api-lt
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        KeyName: !Ref KeyName
        IamInstanceProfile:
          Name: !Ref InstanceProfileName
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: true
            Groups:
              - !Ref ApiSecurityGroup
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize: 100
              VolumeType: gp3
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: interviewcoach-api
              - Key: Environment
                Value: prod
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y docker.io docker-compose-v2 awscli curl nginx
            systemctl enable docker nginx
            systemctl start docker
            usermod -aG docker ubuntu
            mkdir -p /apps/interviewcoach/docker /apps/storage /apps/logs
            chown -R ubuntu:ubuntu /apps
            cat > /etc/nginx/sites-available/default <<'NGINX'
            server {
                listen 80 default_server;
                listen [::]:80 default_server;
                server_name _;
                client_max_body_size 50m;
                location / {
                    proxy_pass http://127.0.0.1:5000;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto https;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_read_timeout 300s;
                }
            }
            NGINX
            nginx -t && systemctl reload nginx
            cat > /apps/interviewcoach/docker/compose.prod.yml <<COMPOSE
            name: interviewcoach-prod
            services:
              api:
                image: ${EcrRegistry}/interviewcoach-api:${ImageTag}
                restart: unless-stopped
                ports:
                  - "5000:5000"
                environment:
                  AWS_REGION: ${AWS::Region}
                  AWS_SECRETS_MANAGER_SECRET_ID: interviewcoach/prod/app
                logging:
                  driver: awslogs
                  options:
                    awslogs-region: ${AWS::Region}
                    awslogs-group: ${ApiLogGroup}
                    awslogs-create-group: "true"
            COMPOSE
            aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin ${EcrRegistry}
            cd /apps/interviewcoach
            docker compose -f docker/compose.prod.yml pull || true
            docker compose -f docker/compose.prod.yml up -d

  ApiAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: interviewcoach-prod-api-asg
      LaunchTemplate:
        LaunchTemplateId: !Ref ApiLaunchTemplate
        Version: !GetAtt ApiLaunchTemplate.LatestVersionNumber
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      DesiredCapacity: !Ref DesiredCapacity
      VPCZoneIdentifier: !Ref PublicSubnetIds
      TargetGroupARNs:
        - !Ref ApiTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      Tags:
        - Key: Name
          Value: interviewcoach-api
          PropagateAtLaunch: true
        - Key: Environment
          Value: prod
          PropagateAtLaunch: true

  CpuScaleUpPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AdjustmentType: ChangeInCapacity
      AutoScalingGroupName: !Ref ApiAutoScalingGroup
      Cooldown: 300
      ScalingAdjustment: 1

  CpuScaleDownPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AdjustmentType: ChangeInCapacity
      AutoScalingGroupName: !Ref ApiAutoScalingGroup
      Cooldown: 300
      ScalingAdjustment: -1

  CpuHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: ASG CPU high - scale out
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref ApiAutoScalingGroup
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 70
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref CpuScaleUpPolicy

  CpuLowAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: ASG CPU low - scale in
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref ApiAutoScalingGroup
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 30
      ComparisonOperator: LessThanThreshold
      AlarmActions:
        - !Ref CpuScaleDownPolicy

Outputs:
  AlbDnsName:
    Value: !GetAtt ApplicationLoadBalancer.DNSName
  AlbArn:
    Value: !Ref ApplicationLoadBalancer
  LoadBalancerFullName:
    Value: !GetAtt ApplicationLoadBalancer.LoadBalancerFullName
  TargetGroupArn:
    Value: !Ref ApiTargetGroup
  TargetGroupFullName:
    Value: !GetAtt ApiTargetGroup.TargetGroupFullName
  AutoScalingGroupName:
    Value: !Ref ApiAutoScalingGroup
  ApiSecurityGroupId:
    Value: !Ref ApiSecurityGroup
  RedisPrimaryEndpoint:
    Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Address
  RedisPort:
    Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Port
  RedisUrl:
    Value: !Sub "redis://${RedisReplicationGroup.PrimaryEndPoint.Address}:${RedisReplicationGroup.PrimaryEndPoint.Port}/0"
