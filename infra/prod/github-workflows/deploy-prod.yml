# COPY to moback-ai/devsecops-platform → .github/workflows/interviewcoach-deploy-prod.yml
# Do NOT enable this workflow in interviewcoach-AI.
#
# One workflow: build (if API) + deploy. Three inputs only.
name: InterviewCoach · Release to Production

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch or tag (interviewcoach-AI)
        required: true
        default: develop
      deploy_api:
        description: Build API image + roll out to servers
        type: boolean
        default: true
      deploy_frontend:
        description: Build frontend + sync to S3
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: interviewcoach-deploy-prod
  cancel-in-progress: false

env:
  DEVSECOPS_RUN: "1"
  AWS_REGION: ap-south-1
  APP_REPO: moback-ai/interviewcoach-AI
  AWS_ACCOUNT_ID: "328991713462"

jobs:
  gate:
    name: DevSecOps gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-devsecops-actor.sh

  build-api:
    name: Build API image
    runs-on: ubuntu-latest
    needs: [gate]
    if: inputs.deploy_api
    environment: production
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ inputs.git_ref }}
          path: app
          token: ${{ secrets.APP_REPO_READ_TOKEN }}

      - id: tag
        run: |
          SHORT=$(git -C app rev-parse --short HEAD)
          echo "image_tag=prod-$(date -u +%Y%m%d)-${SHORT}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=prod-$(date -u +%Y%m%d)-${SHORT}" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API
        env:
          ECR: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        run: |
          docker buildx build \
            --file app/docker/api/Dockerfile.prod \
            --target runtime \
            --tag "$ECR/interviewcoach-api:$IMAGE_TAG" \
            --cache-from type=registry,ref="$ECR/interviewcoach-api:buildcache" \
            --cache-to type=registry,ref="$ECR/interviewcoach-api:buildcache",mode=max \
            --push \
            app
          echo "Pushed $ECR/interviewcoach-api:$IMAGE_TAG"

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: [gate, build-api]
    if: inputs.deploy_api
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ inputs.git_ref }}
          path: app
          token: ${{ secrets.APP_REPO_READ_TOKEN }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Roll out to ASG
        working-directory: app
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ needs.build-api.outputs.image_tag }}
        run: bash infra/prod/scripts/06-code-deploy-api-asg.sh

      - name: Smoke test
        working-directory: app
        run: bash infra/prod/scripts/07-smoke-test-prod.sh

  deploy-frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest
    needs: [gate]
    if: inputs.deploy_frontend
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ inputs.git_ref }}
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Build and sync S3
        working-directory: app
        env:
          STATIC_BUCKET: ${{ secrets.STATIC_S3_BUCKET }}
          CF_DIST_ID: ${{ secrets.CLOUDFRONT_DIST_ID }}
        run: bash infra/prod/scripts/08-code-frontend.sh
