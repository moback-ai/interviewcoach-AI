# COPY to moback-ai/devsecops-platform → .github/workflows/interviewcoach-deploy-prod.yml
# Do NOT enable this workflow in interviewcoach-AI.
#
# Production deploy — rollout only (no Docker build). Build images separately first.
name: InterviewCoach · Deploy Production

on:
  workflow_dispatch:
    inputs:
      app_git_ref:
        description: interviewcoach-AI git ref (branch, tag, or SHA)
        required: true
        default: develop
      image_tag:
        description: ECR image tag (must already exist — from Build Docker Images workflow)
        required: true
      deploy_api:
        description: Roll out API image to ASG
        type: boolean
        default: true
      deploy_frontend:
        description: Build frontend + sync S3
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: interviewcoach-deploy-prod
  cancel-in-progress: false

env:
  DEVSECOPS_RUN: "1"
  AWS_REGION: ap-south-1

jobs:
  gate:
    name: DevSecOps gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Only DevSecOps may deploy
        run: bash scripts/check-devsecops-actor.sh

  deploy:
    name: Roll out production
    runs-on: ubuntu-latest
    needs: [gate]
    environment: production
    steps:
      - name: Checkout application repo
        uses: actions/checkout@v4
        with:
          repository: moback-ai/interviewcoach-AI
          ref: ${{ inputs.app_git_ref }}
          path: app

      - name: Set image tag
        working-directory: app
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          echo "IMAGE_TAG=$INPUT_IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Verify API image in ECR
        if: inputs.deploy_api
        working-directory: app
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: bash infra/prod/scripts/05a-verify-ecr-image.sh

      - name: Roll out API to ASG
        if: inputs.deploy_api
        working-directory: app
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: bash infra/prod/scripts/06-code-deploy-api-asg.sh

      - name: Sync CloudFront API origin to ALB
        if: inputs.deploy_api
        working-directory: app
        env:
          CF_DIST_ID: ${{ secrets.CLOUDFRONT_DIST_ID }}
        run: bash infra/prod/scripts/06b-cloudfront-api-origin-alb.sh

      - name: Setup Node
        if: inputs.deploy_frontend
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Build frontend and sync S3
        if: inputs.deploy_frontend
        working-directory: app
        env:
          STATIC_BUCKET: ${{ secrets.STATIC_S3_BUCKET }}
          CF_DIST_ID: ${{ secrets.CLOUDFRONT_DIST_ID }}
        run: bash infra/prod/scripts/08-code-frontend.sh

      - name: Post-deploy smoke tests
        if: inputs.deploy_api
        env:
          APP_GIT_REF: ${{ inputs.app_git_ref }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' https://www.ugaanlabs.ai/api/health)
          if [[ "$code" == "503" ]]; then
            echo "API returned 503 — ASG may be off-hours (10:00–19:00 IST). Rollout succeeded; verify health during business hours."
          else
            curl -fsS https://www.ugaanlabs.ai/api/health | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          assert d.get('status')=='healthy', d
          assert d['services']['llm']['provider']=='bedrock', d['services']['llm']
          assert 'ollama' not in d['services'], d['services']
          stt=d['services']['stt']
          assert stt['chain']==['openrouter','amazon'], stt
          print('health OK:', d['services']['llm']['provider'], stt['chain'])
          "
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -I https://ugaanlabs.ai/signup)
          test "$code" = "301" || (echo "expected apex→www 301, got $code" && exit 1)
          echo "apex redirect OK"
          echo "Deployed app ref: $APP_GIT_REF  image: $IMAGE_TAG"
