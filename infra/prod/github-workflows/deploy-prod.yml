# COPY to moback-ai/devsecops-platform → .github/workflows/interviewcoach-deploy-prod.yml
# Do NOT enable this workflow in interviewcoach-AI.
#
# Build (optional) + deploy with quality gate, business-hours guard, and rollback.
name: InterviewCoach · Release to Production

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Release branch or tag on interviewcoach-AI (manual — release-<month>-<year>, e.g. release-july-2026)
        required: true
        type: string
      deploy_api:
        description: Build API image + roll out to servers
        type: boolean
        default: true
      deploy_frontend:
        description: Build frontend + sync to S3
        type: boolean
        default: false
      allow_off_hours:
        description: Allow deploy/smoke outside 10:00–19:00 IST (emergency only)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: interviewcoach-deploy-prod
  cancel-in-progress: false

env:
  DEVSECOPS_RUN: "1"
  AWS_REGION: ap-south-1
  APP_REPO: moback-ai/interviewcoach-AI
  AWS_ACCOUNT_ID: "328991713462"
  ALLOW_OFF_HOURS_DEPLOY: ${{ inputs.allow_off_hours && '1' || '0' }}

jobs:
  gate:
    name: DevSecOps gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-devsecops-actor.sh

      - name: Validate release ref name
        env:
          GIT_REF: ${{ inputs.git_ref }}
        run: |
          set -euo pipefail
          REF="${GIT_REF// /}"
          if [[ -z "$REF" ]]; then
            echo "::error::Enter a release branch or tag: release-<month>-<year> (e.g. release-july-2026)."
            exit 1
          fi
          shopt -s nocasematch
          if [[ ! "$REF" =~ ^release-(january|february|march|april|may|june|july|august|september|october|november|december|0[1-9]|1[0-2])-[0-9]{4}$ ]]; then
            echo "::error::git_ref must be release-<month>-<year> (e.g. release-july-2026 or release-07-2026), not '${GIT_REF}'."
            exit 1
          fi
          echo "Release ref: ${REF}"

  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    needs: [gate]
    outputs:
      frontend: ${{ steps.paths.outputs.frontend }}
      backend: ${{ steps.paths.outputs.backend }}
      database: ${{ steps.paths.outputs.database }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ inputs.git_ref }}
          path: app
          token: ${{ secrets.APP_REPO_READ_TOKEN }}
          fetch-depth: 0

      - id: paths
        working-directory: app
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          mapfile -t files < <(git diff --name-only "${BASE}" HEAD || true)
          frontend=false
          backend=false
          database=false
          for file in "${files[@]}"; do
            [[ "$file" == frontend/* ]] && frontend=true
            [[ "$file" == backend/* || "$file" == docker/api/* ]] && backend=true
            [[ "$file" == database/* ]] && database=true
          done
          {
            echo "frontend=${frontend}"
            echo "backend=${backend}"
            echo "database=${database}"
          } >> "$GITHUB_OUTPUT"
          echo "Changed paths:"
          printf '  %s\n' "${files[@]:-"(none)"}"

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [gate]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ inputs.git_ref }}
          path: app
          token: ${{ secrets.APP_REPO_READ_TOKEN }}

      - name: Run pre-deploy quality gate
        uses: ./app/.github/actions/pre-deploy-quality-gate
        with:
          git_ref: ${{ inputs.git_ref }}

  build-api:
    name: Build API image
    runs-on: ubuntu-latest
    needs: [gate, quality-gate]
    if: inputs.deploy_api
    environment: production
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ inputs.git_ref }}
          path: app
          token: ${{ secrets.APP_REPO_READ_TOKEN }}

      - id: tag
        run: |
          SHORT=$(git -C app rev-parse --short HEAD)
          echo "image_tag=prod-$(date -u +%Y%m%d)-${SHORT}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=prod-$(date -u +%Y%m%d)-${SHORT}" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API
        env:
          ECR: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        run: |
          docker buildx build \
            --file app/docker/api/Dockerfile.prod \
            --target runtime \
            --tag "$ECR/interviewcoach-api:$IMAGE_TAG" \
            --cache-from type=registry,ref="$ECR/interviewcoach-api:buildcache" \
            --cache-to type=registry,ref="$ECR/interviewcoach-api:buildcache",mode=max \
            --push \
            app
          echo "Pushed $ECR/interviewcoach-api:$IMAGE_TAG"

      - name: Scan API image (CRITICAL CVE gate)
        env:
          ECR: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/trivy.tar.gz \
            https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C "$HOME/.local/bin" trivy
          trivy image --severity CRITICAL --exit-code 1 \
            "$ECR/interviewcoach-api:$IMAGE_TAG"

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: [gate, quality-gate, build-api, detect-changes]
    if: inputs.deploy_api
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ inputs.git_ref }}
          path: app
          token: ${{ secrets.APP_REPO_READ_TOKEN }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Business hours guard
        working-directory: app
        run: bash infra/prod/scripts/lib/deploy-business-hours.sh

      - name: Database migration notice
        if: needs.detect-changes.outputs.database == 'true'
        run: |
          echo "::warning::database/** changed. Apply pending SQL migrations before or during this deploy."
          echo "See app/database/README.md and docs/DEPLOY.md."

      - name: Capture current API image tag
        id: previous
        working-directory: app
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          TAG=$(bash infra/prod/scripts/lib/get-current-api-image-tag.sh)
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Previous API image tag: ${TAG}"

      - name: Roll out to ASG
        id: rollout
        working-directory: app
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ needs.build-api.outputs.image_tag }}
        run: bash infra/prod/scripts/06-code-deploy-api-asg.sh

      - name: Smoke test
        id: smoke
        working-directory: app
        run: bash infra/prod/scripts/07-smoke-test-prod.sh

      - name: Rollback API on smoke failure
        if: failure() && steps.smoke.outcome == 'failure'
        working-directory: app
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ steps.previous.outputs.image_tag }}
        run: |
          echo "::warning::Smoke failed. Rolling back to ${IMAGE_TAG}"
          bash infra/prod/scripts/07b-rollback-api-asg.sh

      - name: Deploy summary
        if: always()
        run: |
          {
            echo "## API deploy"
            echo "- Ref: \`${{ inputs.git_ref }}\`"
            echo "- New image: \`${{ needs.build-api.outputs.image_tag }}\`"
            echo "- Previous image: \`${{ steps.previous.outputs.image_tag }}\`"
            echo "- Database changes detected: \`${{ needs.detect-changes.outputs.database }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest
    needs: [gate, quality-gate, detect-changes]
    if: inputs.deploy_frontend
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ inputs.git_ref }}
          path: app
          token: ${{ secrets.APP_REPO_READ_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Business hours guard
        working-directory: app
        run: bash infra/prod/scripts/lib/deploy-business-hours.sh

      - name: Build and sync S3
        working-directory: app
        env:
          STATIC_BUCKET: ${{ secrets.STATIC_S3_BUCKET }}
          CF_DIST_ID: ${{ secrets.CLOUDFRONT_DIST_ID }}
        run: bash infra/prod/scripts/08-code-frontend.sh

      - name: Frontend smoke
        working-directory: app
        run: bash infra/prod/scripts/07-smoke-test-prod.sh
