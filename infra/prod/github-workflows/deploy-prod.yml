# Copy to devsecops-platform: .github/workflows/interviewcoach-deploy-prod.yml
name: InterviewCoach · Deploy PROD

on:
  workflow_dispatch:
    inputs:
      app_git_ref:
        description: Git ref (commit SHA or develop)
        required: true
      image_tag:
        description: ECR image tag
        required: true
        default: prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: moback-ai/interviewcoach-AI
          ref: ${{ inputs.app_git_ref }}

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API (Dockerfile.prod)
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          docker build -f docker/api/Dockerfile.prod -t "$ECR_REGISTRY/interviewcoach-api:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/interviewcoach-api:$IMAGE_TAG"

      - name: Deploy API to prod host
        env:
          API_HOST: ${{ secrets.PROD_API_SSH_HOST }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: bash infra/prod/scripts/06-code-deploy-api.sh

      - name: Frontend to S3 + CloudFront
        env:
          STATIC_BUCKET: ${{ secrets.STATIC_S3_BUCKET }}
          CF_DIST_ID: ${{ secrets.CLOUDFRONT_DIST_ID }}
        run: bash infra/prod/scripts/08-code-frontend.sh

      - name: Post-deploy smoke tests
        run: |
          set -euo pipefail
          curl -fsS https://www.ugaanlabs.ai/api/health | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          assert d.get('status')=='healthy', d
          assert d['services']['llm']['provider']=='bedrock', d['services']['llm']
          assert 'ollama' not in d['services'], 'prod should not expose ollama in health'
          assert d['services']['stt']['chain']==['openrouter','amazon'], d['services']['stt']
          print('health OK:', d['services']['llm']['provider'], d['services']['stt']['chain'])
          "
          code=$(curl -s -o /dev/null -w '%{http_code}' -I https://ugaanlabs.ai/signup)
          test "$code" = "301" || (echo "expected apex→www 301, got $code" && exit 1)
          echo "apex redirect OK"
