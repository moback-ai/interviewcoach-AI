title = "InterviewCoach gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Ignore known safe patterns and generated assets"
paths = [
  '''\.env\.example$''',
  '''backend/Piper/''',
  '''frontend/dist/''',
  '''package-lock\.json$''',
  '''infra/prod/prod\.env$''',
  '''scripts/aws-plan-b/config\.env$''',
  '''scripts/aws-plan-b/outputs\.env$''',
  '''docs/diagrams/.*\.drawio$''',
]
