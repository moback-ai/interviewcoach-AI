# DEPRECATED — laptop-only Docker smoke test before prod deploy.
# Prod uses ECR + compose.prod.yml on AWS (no local docker prod).
#
# Usage: docker compose -f docker/compose.laptop.yml up --build

name: interviewcoach-laptop

services:
  api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ../backend/.env
    environment:
      STORAGE_BACKEND: local
      STORAGE_PATH: /apps/storage
      UPLOAD_FOLDER: /apps/storage
    volumes:
      - laptop_storage:/apps/storage

volumes:
  laptop_storage:
