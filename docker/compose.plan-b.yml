# Plan B production layout (reference).
# On AWS: run web on frontend EC2; api on API EC2; transcribe (+ host Ollama) on AI EC2.
# EC2 instance role must allow secretsmanager:GetSecretValue on interviewcoach/prod/app.

name: interviewcoach

services:
  api:
    image: ${ECR_REGISTRY}/interviewcoach-api:${IMAGE_TAG:-develop}
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_SECRETS_MANAGER_SECRET_ID: interviewcoach/prod/app
      TRANSCRIBE_SERVICE_URL: ${TRANSCRIBE_SERVICE_URL:-}
    volumes:
      - /apps/storage:/apps/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  transcribe:
    image: ${ECR_REGISTRY}/interviewcoach-api:${IMAGE_TAG:-develop}
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_SECRETS_MANAGER_SECRET_ID: interviewcoach/prod/app
      TRANSCRIBE_SIDECAR_PORT: "5001"
      HEALTH_PORT: "5001"
      ENABLE_AI_WARMUP: "false"
    command:
      - python
      - -c
      - |
        from app import app
        app.run(host="0.0.0.0", port=5001, threaded=True)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5001/api/health"]
      interval: 30s
      timeout: 15s
      start_period: 180s
      retries: 3

  web:
    image: ${ECR_REGISTRY}/interviewcoach-web:${IMAGE_TAG:-develop}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
