# AI host only — Whisper sidecar. Ollama stays on host (systemd).
services:
  transcribe:
    image: ${ECR_REGISTRY}/interviewcoach-api:${IMAGE_TAG}
    container_name: interviewcoach-transcribe
    restart: unless-stopped
    network_mode: host
    environment:
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_SECRETS_MANAGER_SECRET_ID: interviewcoach/prod/app
      TRANSCRIBE_SIDECAR_PORT: "5001"
      HEALTH_PORT: "5001"
      ENABLE_AI_WARMUP: "false"
    command:
      - python
      - -c
      - |
        from app import app
        app.run(host="0.0.0.0", port=5001, threaded=True)
