# DEPRECATED — Plan B API host layout. Use docker/compose.prod.yml
services:
  api:
    image: ${ECR_REGISTRY}/interviewcoach-api:${IMAGE_TAG}
    container_name: interviewcoach-api
    restart: unless-stopped
    network_mode: host
    environment:
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_SECRETS_MANAGER_SECRET_ID: interviewcoach/prod/app
    volumes:
      - /apps/storage:/apps/storage
